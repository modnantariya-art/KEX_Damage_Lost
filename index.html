<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NIM Claim · เคส KEX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#18212B; --ink2:#374151; --muted:#4B5563; --line:#DDE1E7; --line2:#EEF0F3;
  --input:#CDD3DB; --primary:#1F4E8C; --primary-ink:#163a69; --primary-soft:#D9E4F5;
  --claim:#FBDDB8; --claim-ink:#7C2D12; --claim-soft:#FFF4E6; --claim-line:#F0C99A;
  --gray-soft:#EBEDF0; --red:#B91C1C; --red-soft:#FDE2E1; --nav:#18212B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;font-size:15px;line-height:1.5}
a{color:var(--primary)}a:hover{color:var(--primary-ink)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:13px}
.app{min-height:100vh;display:flex;flex-wrap:wrap}
nav{flex:1 1 232px;max-width:100%;background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:4px}
nav .brand{font-size:18px;font-weight:700;padding:0 12px 2px}
nav .sub{font-size:13px;color:#AEB6C2;padding:0 12px 20px}
nav button{all:unset;display:block;padding:12px;border-radius:8px;color:#C9D3E0;font-size:15px;cursor:pointer}
nav button:hover{background:#243243}
nav button[aria-current="page"]{background:#2B3A4C;color:#fff;font-weight:600}
nav button:focus-visible{outline:2px solid #9DB4D6}
nav .user{margin-top:auto;font-size:12px;color:#AEB6C2;padding:16px 12px 0;word-break:break-all}
main{flex:999 1 560px;min-width:0;padding:32px 40px;display:flex;flex-direction:column;gap:24px}
@media (max-width:700px){main{padding:20px 16px}nav{flex-direction:row;flex-wrap:wrap;padding:12px}nav .sub,nav .user{display:none}}
h1{margin:0;font-size:28px;line-height:38px}
h2{margin:0;font-size:17px;line-height:24px}
h3{margin:0;font-size:17px;line-height:24px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.head .title{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.desc{font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:20px 24px}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:4px}
.tile .l{font-size:13px;color:var(--ink2)} .tile .v{font-size:26px;line-height:34px;font-weight:700} .tile .s{font-size:12px;color:var(--muted)}
.tile.warn{background:var(--claim-soft);border-color:var(--claim-line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f .lab{font-size:14px;font-weight:600;color:var(--ink)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--input);border-radius:8px}
input,select{height:44px;padding:0 12px}
textarea{padding:10px 12px;min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
input[readonly]{background:var(--bg)}
.err{border-color:var(--red)!important;background:#FFF7F7!important}
.btn{font:inherit;font-size:15px;height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--input);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--primary-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.claim{border-color:#B45309;color:var(--claim-ink);font-weight:600}
.btn:disabled{opacity:.55;cursor:wait}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);background:#FAFBFC;padding:12px 16px;border-bottom:1px solid #E5E8EC;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:top}
td.r,th.r{text-align:right}
tr.late td{background:#FFF7F7}
.late-flag{color:var(--red);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.linkbtn{all:unset;white-space:nowrap;color:var(--primary);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--primary)}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.count{all:unset;box-sizing:border-box;min-height:76px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.count:focus-visible{outline:2px solid var(--primary)}
.count[aria-pressed="true"]{border:2px solid var(--primary)}
.count .c{font-size:12px;font-weight:600} .count .n{font-size:13px;color:var(--ink2)} .count .v{font-size:22px;font-weight:700}
.count.sla{background:var(--red-soft);border-color:#F5B5B1}.count.sla .c{color:var(--red)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.check{display:flex;align-items:center;gap:8px;height:44px;font-size:14px}
.check input{width:18px;height:18px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:220px;border-bottom:1px solid var(--input);padding-top:24px}
.bars .col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars .col .bar{width:100%;max-width:32px;border-radius:4px 4px 0 0;background:#9DB4D6}
.bars .col .bar.cur{background:var(--primary)}
.bars .col .val{font-size:12px;font-weight:600}
.xlab{display:flex;gap:8px}.xlab span{flex:1 1 0;text-align:center;font-size:12px;color:var(--muted);min-width:0}
.hbar{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) 72px;gap:12px;align-items:center;font-size:14px}
.hbar .track{height:16px;background:var(--line2);border-radius:4px}
.hbar .fill{height:16px;background:var(--primary);border-radius:0 4px 4px 0}
.split{display:flex;height:16px;gap:2px}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:none;background:#fff;padding:0 14px;height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 0;border-bottom:1px solid #E5E8EC}
.tabs button{font:inherit;font-size:15px;height:44px;padding:0 16px;border:none;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{border-bottom-color:var(--primary);color:var(--primary);font-weight:600}
.steps{list-style:none;margin:0;padding:16px 20px;display:flex;flex-wrap:wrap;gap:8px 4px}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;font-size:13px;background:var(--bg);color:var(--muted)}
.steps li .dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:#fff;font-size:12px;font-weight:600}
.steps li.done{background:#EEF2F8;color:var(--primary-ink)} .steps li.done .dot{background:var(--primary)}
.steps li.cur{background:var(--primary);color:#fff;font-weight:600} .steps li.cur .dot{background:#fff;color:var(--primary)}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cols .left{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.cols .right{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px}
.sec{padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.sec.current{border:2px solid var(--primary)}
.sec .tag{font-size:13px;font-weight:600;color:var(--primary)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.msg{padding:12px 14px;border-radius:8px;font-size:14px}
.msg.bad{background:var(--red-soft);color:var(--red)}
.msg.good{background:#E6F0FA;color:var(--primary-ink)}
.msg.note{background:var(--claim-soft);color:var(--claim-ink)}
.timeline{list-style:none;margin:0;padding:14px 0 0;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:12px}
.timeline li{display:flex;flex-direction:column;gap:2px;font-size:14px}
.timeline .m{font-size:12px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:10}
.loading{padding:64px;text-align:center;color:var(--muted)}
@media print{nav,.no-print{display:none!important}main{padding:0}body{background:#fff}.card{break-inside:avoid}}
.chipset{display:inline-flex;flex-wrap:wrap;gap:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;margin:0}
.kv div{display:flex;flex-direction:column;gap:2px}.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:0;font-weight:600;font-size:14px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.lane{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;background:#FCFCFD}
.lane.active{border:2px solid #B45309;background:#fff}
.subhead{font-size:13px;font-weight:600;color:var(--claim-ink);border-top:1px dashed var(--line);padding-top:10px}
details.sec summary{cursor:pointer;font-weight:600;font-size:16px;list-style-position:outside}
details.sec:not([open]){padding-top:14px;padding-bottom:14px}
.msg svg{vertical-align:-2px}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="เมนูหลัก">
    <div class="brand">NIM Claim</div>
    <div class="sub">เคสเสียหาย / สูญหาย · KEX</div>
    <button type="button" data-page="dashboard">Dashboard KEX</button>
    <button type="button" data-page="list">รายการเคส</button>
    <button type="button" data-page="form">เปิดเคสใหม่</button>
    <button type="button" data-page="reconcile">กระทบยอดเงิน</button>
    <div class="user"><span id="user"></span><br><button type="button" id="logout" style="padding:8px 0;font-size:12px;text-decoration:underline">ออกจากระบบ</button></div>
  </nav>
  <main id="main"><div class="loading">กำลังโหลดข้อมูล…</div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sync" role="status" aria-live="polite" style="position:fixed;right:16px;top:12px;display:none;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);z-index:9">กำลังอัปเดตข้อมูลล่าสุด…</div>

<script>
/* ============================================================ ตั้งค่า
   วางลิงก์ตัวเชื่อม (Web app URL ที่ได้จาก Deploy ใน Apps Script ของ Google Sheet) ระหว่างเครื่องหมาย ' '
   ตัวอย่าง: var API_URL = 'https://script.google.com/macros/s/xxxxxxxx/exec';            */
var API_URL = 'https://script.google.com/macros/s/AKfycbysidAobNhvSIdrAdhOPGV1YMCrupAxJOzglVJyLYLZJGOv20Q4fdYngtSxB9rqBmWiRA/exec';
var S = {
  boot: null, cases: [], page: 'dashboard',
  list: { st: 'open', q: '', type: '', src: '', owner: '', lateOnly: false },
  dash: { month: null, service: '', metric: 'rate' },
  rec: { month: 'all', tab: 'receive' },
  form: { caseId: null, detail: null, missing: [], message: '', msgType: '' },
  busy: false
};

/* ช่องทางรับรู้เคส (ต้องตรงกับตัวเชื่อม) */
var SRC = ['KEX แจ้ง (Email)', 'ลูกค้ายื่นเคลม (เว็บ NIM)'];
function srcShort(s){ return s===SRC[1] ? 'ลูกค้ายื่นเอง' : (s===SRC[0] ? 'KEX แจ้ง' : '–'); }

/* ช่องข้อมูลทั้งหมด: key → { l: ชื่อ, t: ชนิด, list, hint, wide } */
var FD = {
  source:{ l:'ช่องทางรับรู้เคส', t:'select', list:'source' },
  owner:{ l:'ผู้รับผิดชอบ', t:'list', list:'owner' },
  kex_notice_date:{ l:'วันที่ KEX แจ้ง (Email)', t:'date' },
  cust_claim_date:{ l:'วันที่ลูกค้ายื่นเคลม (เว็บ NIM)', t:'date' },
  nim_claim_no:{ l:'เลขเคลม NIM', t:'text' },
  goods_received_date:{ l:'วันที่ลูกค้ารับสินค้า', t:'date', hint:'ลูกค้าต้องยื่นเคลมภายใน 3 วันหลังรับสินค้า' },
  tracking_no:{ l:'เลข Tracking KEX', t:'text', hint:'ห้ามซ้ำกับเคสอื่น' },
  nim_tracking_no:{ l:'เลข Tracking NIM', t:'text', hint:'ซ้ำกับเคสอื่นได้' },
  incident_type:{ l:'ประเภทเหตุ', t:'select', list:'incident_type' },
  damage_type:{ l:'ลักษณะความเสียหาย', t:'list', list:'damage_type', hint:'บังคับเมื่อเป็น “เสียหาย”' },
  cause:{ l:'สาเหตุ (ตาม KEX)', t:'list', list:'cause' },
  incident_location:{ l:'จุดเกิดเหตุ / Hub KEX', t:'list', list:'incident_location' },
  origin_dc:{ l:'DC ต้นทาง', t:'list', list:'origin_dc' },
  sender:{ l:'ผู้ส่ง / บริษัทลูกค้า', t:'text' },
  service_type:{ l:'ประเภทบริการ', t:'select', list:'service_type' },
  product_desc:{ l:'รายละเอียดสินค้า', t:'text' },
  goods_value:{ l:'มูลค่าสินค้า (บาท)', t:'money' },
  incident_detail:{ l:'รายละเอียดเหตุการณ์', t:'textarea', wide:true },
  cc_action:{ l:'ความประสงค์ผู้รับ (จาก CC)', t:'select', list:'cc_action', hint:'นำส่ง / ส่งคืน / ทำลาย' },
  claim_intent:{ l:'ความประสงค์เคลม (จาก CC)', t:'select', list:'claim_intent', hint:'ไม่ประสงค์ / ไม่เข้าเงื่อนไข = ปิดเคสทันที · เว้นว่างได้ถ้า CC ยังไม่มีผล' },
  cc_date:{ l:'วันที่ได้ผลจาก CC', t:'date' },
  goods_result:{ l:'ผลการจัดการสินค้า', t:'text' },
  goods_done_date:{ l:'วันที่จัดการสินค้าเสร็จ', t:'date', hint:'เว้นว่าง = วันที่กดยืนยัน' },
  not_eligible_reason:{ l:'เหตุผลไม่เข้าเงื่อนไข', t:'textarea', wide:true, hint:'กรอกเมื่อกด “ไม่เข้าเงื่อนไข”' },
  claim_round:{ l:'รอบเคลม', t:'readonly' },
  claim_submit_date:{ l:'วันที่แจ้งเคลมเข้าระบบ KEX', t:'date' },
  kex_claim_no:{ l:'เลขเคลม KEX', t:'text' },
  claim_amount:{ l:'ยอดเรียกร้อง (บาท)', t:'money', hint:'ตั้งต้นจากมูลค่าสินค้า' },
  kex_decision:{ l:'ผลพิจารณา KEX', t:'select', list:'kex_decision' },
  kex_decision_date:{ l:'วันที่ได้ผล KEX', t:'date' },
  approved_amount:{ l:'ยอดอนุมัติ (บาท)', t:'money' },
  reject_reason:{ l:'เหตุผลปฏิเสธ / ตัดยอด', t:'textarea', wide:true },
  appeal_date:{ l:'วันที่ยื่นอุทธรณ์', t:'date' },
  appeal_reason:{ l:'เหตุผลอุทธรณ์', t:'textarea', wide:true },
  kex_paid_date:{ l:'วันที่รับเงินจาก KEX', t:'date' },
  kex_paid_amount:{ l:'ยอดรับจริงจาก KEX (บาท)', t:'money', hint:'ตั้งต้นจากยอดอนุมัติ' },
  kex_payment_ref:{ l:'เลขอ้างอิงการโอน KEX', t:'text' },
  cust_paid_date:{ l:'วันที่โอนเงินลูกค้า', t:'date' },
  cust_paid_amount:{ l:'ยอดโอนให้ลูกค้า (บาท)', t:'money', hint:'ตั้งต้นจากยอดเรียกร้อง' }
};
var REQ = ['source','owner','kex_notice_date','cust_claim_date','nim_claim_no','tracking_no','nim_tracking_no','incident_type','origin_dc','sender',
  'service_type','product_desc','goods_value','claim_submit_date','claim_amount','kex_decision',
  'kex_decision_date','kex_paid_date','kex_paid_amount','cust_paid_date','cust_paid_amount','appeal_date','appeal_reason'];
function labelOf(k){ return FD[k] ? FD[k].l : k; }

/* ============================================================ utils */
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ return (v===''||v==null||isNaN(Number(v))) ? null : Number(v); }
function money(v){ var n=num(v); return n==null ? '–' : n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function int(v){ var n=num(v); return n==null ? '–' : Math.round(n).toLocaleString('en-US'); }
function pct(a,b){ return b ? (a/b*100).toFixed(1)+'%' : '–'; }
function fmtD(s){ if(!s) return '–'; var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(s); }
var TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function mLabel(ym){ var p=ym.split('-'); return TH_M[Number(p[1])-1]+' '+p[0]; }
function mShort(ym){ return TH_M[Number(ym.split('-')[1])-1]; }
function ym(s){ return s ? String(s).slice(0,7) : ''; }
function addMonths(ymStr,n){ var p=ymStr.split('-'); var d=new Date(Number(p[0]),Number(p[1])-1+n,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function daysBetween(a,b){ if(!a||!b) return null; var x=new Date(String(a).slice(0,10)), y=new Date(String(b).slice(0,10)); if(isNaN(x)||isNaN(y)) return null; return Math.round((y-x)/86400000); }
function daysSince(a){ return daysBetween(a, S.boot.today); }
function code(st){ return String(st||'').trim().split(/\s+/)[0]; }
function closed(st){ return code(st).charAt(0)==='X'; }
function stOf(cd){ return (S.boot.statuses||[]).filter(function(s){ return s.code===cd; })[0] || null; }
function stLabel(cd){ var s=stOf(cd); return s ? s.label : cd; }
function caseMonth(c){ return ym(c.kex_notice_date || c.cust_claim_date || c.opened_at); }
function tone(cd){
  if(cd.charAt(0)==='X') return 'background:#18212B;color:#fff';
  if(['KD','ND','KX','NX'].indexOf(cd)>=0) return 'background:#EBEDF0;color:#374151';
  if(['C2','K1','K2','K3','N2'].indexOf(cd)>=0) return 'background:#FBDDB8;color:#7C2D12';
  return 'background:#D9E4F5;color:#163a69';
}
function chip(st, prefix){ if(!st) return ''; return '<span class="chip" style="'+tone(code(st))+'">'+(prefix?'<b>'+prefix+'</b> · ':'')+esc(st)+'</span>'; }
/* สถานะเคส + สถานะ 2 ฝั่ง (แสดงฝั่งเมื่อกำลังเคลม หรือ all=true) */
function chips(c, all){
  var h=chip(c.status);
  if(all || code(c.status)==='C2'){
    if(!all) h='<span class="desc" style="font-size:12px;width:100%">C2 กำลังเคลม</span>';
    if(c.kex_track) h+=chip(c.kex_track,'KEX'); if(c.nim_track) h+=chip(c.nim_track,'NIM');
  }
  return '<span class="chipset">'+h+'</span>';
}
/* SLA: นับวันในขั้นที่กำลังรอ (ฝั่งเคส / KEX / NIM) เทียบกับ SLA ในชีต Lists */
function slaItems(c){
  var k=code(c.status), out=[];
  var add=function(cd, from){
    var st=stOf(cd), sla=(st && st.sla!=null && st.sla!=='') ? Number(st.sla) : null, d=daysSince(from);
    out.push({ code:cd, days:d, sla:sla, late: sla!=null && d!=null && d>sla });
  };
  if(k==='C1') add(k, c.status_changed_at);
  else if(k==='A1') add(k, c.goods_received_date || c.status_changed_at);
  else if(k==='C2'){
    var ks=code(c.kex_track), ns=code(c.nim_track);
    if(ks==='K1') add('K1', c.cust_claim_date || c.kex_track_at);
    else if(ks==='K2'||ks==='K3') add(ks, c.kex_track_at);
    if(ns==='N2') add('N2', c.nim_track_at);
  }
  return out;
}
function isLate(c){ return slaItems(c).some(function(i){ return i.late; }); }
function maxDays(c){ var d=slaItems(c).map(function(i){return i.days;}).filter(function(x){return x!=null;}); return d.length ? Math.max.apply(null,d) : null; }
function filingGap(c){ return daysBetween(c.goods_received_date, c.cust_claim_date); }
function lateFiling(c){ var g=filingGap(c); return g!=null && g>3; }
function opts(items, cur, blankLabel){
  var h = blankLabel!=null ? '<option value="">'+esc(blankLabel)+'</option>' : '';
  return h + items.map(function(i){ var v=typeof i==='object'?i.v:i, l=typeof i==='object'?i.l:i;
    return '<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+esc(l)+'</option>'; }).join('');
}
function uniq(arr){ return arr.filter(function(v,i){ return v!=='' && v!=null && arr.indexOf(v)===i; }).sort(); }
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){el.style.display='none';},3500); }

var SESSION_KEY='kexClaimSession';
var SESSION=(function(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; } })();
function saveSession(s){ SESSION=s; try{ if(s) localStorage.setItem(SESSION_KEY,JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){} }
var CACHE_KEY='kexClaimCache3';
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ boot:S.boot, cases:S.cases })); }catch(e){} }
function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){ return null; } }
function setSync(on){ var el=document.getElementById('sync'); if(el) el.style.display = on ? 'inline-flex' : 'none'; }
function callApi(action, args, sess){
  sess = sess || SESSION || {};
  return fetch(API_URL, { method:'POST', body: JSON.stringify({ action:action, args:args||[], password:sess.password||'', user:sess.user||'' }) })
    .then(function(r){ if(!r.ok) throw new Error('เชื่อมต่อ Google Sheet ไม่ได้ (HTTP '+r.status+')'); return r.json(); })
    .then(function(j){
      if(j.ok) return j.result;
      var err=new Error(j.error||'เกิดข้อผิดพลาด'); err.auth = j.auth===false; throw err;
    }, function(e){ if(e instanceof TypeError) throw new Error('เชื่อมต่อ Google Sheet ไม่ได้ ตรวจอินเทอร์เน็ต หรือลิงก์ตัวเชื่อม (API_URL)'); throw e; });
}
function initCall(sess){
  return callApi('init',[],sess).catch(function(e){
    if(/ไม่รู้จักคำสั่ง init/.test(e.message)){
      return Promise.all([callApi('getBootstrap',[],sess), callApi('getCases',[],sess)]).then(function(r){ return { boot:r[0], cases:r[1] }; });
    }
    throw e;
  });
}
function api(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return callApi(fn,args).catch(function(e){ if(e.auth){ saveSession(null); showLogin('รหัสผ่านถูกเปลี่ยน กรุณาเข้าสู่ระบบใหม่'); } throw e; });
}

/* ============================================================ nav */
function go(page, caseId){
  S.page = page;
  if(page==='form'){
    var cached = caseId ? S.cases.filter(function(c){return c.case_id===caseId;})[0] : null;
    S.form = { caseId: caseId||null, detail: cached ? { caseData:cached, followups:null, history:null, partial:true } : null, missing:[], message:'', msgType:'' };
  }
  document.querySelectorAll('nav button[data-page]').forEach(function(b){
    var on = b.dataset.page===page && (page!=='form' || !caseId);
    if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  render();
  window.scrollTo(0,0);
  if(page==='form' && caseId) loadDetail(caseId);
}
document.querySelectorAll('nav button[data-page]').forEach(function(b){ b.addEventListener('click',function(){ go(b.dataset.page); }); });

function refreshCases(){ return api('getCases').then(function(c){ S.cases=c; saveCache(); }); }
function applyBundle(r){ if(r.cases){ S.cases=r.cases; saveCache(); } if(r.detail && S.form.caseId===r.detail.caseData.case_id){ S.form.detail=r.detail; } }
function oldConnector(){ return S.boot && !(S.boot.statuses||[]).some(function(s){ return s.code==='K1'; }); }

function render(){
  var m=document.getElementById('main');
  if(!S.boot){ m.innerHTML='<div class="loading">กำลังโหลดข้อมูล…</div>'; return; }
  var h='';
  if(S.page==='dashboard') h=viewDashboard();
  else if(S.page==='list') h=viewList();
  else if(S.page==='form') h=viewForm();
  else if(S.page==='reconcile') h=viewReconcile();
  if(oldConnector()) h='<div class="msg bad" role="alert"><b>ตัวเชื่อมใน Google Sheet ยังเป็นรุ่นเก่า</b> — หน้าเว็บนี้ใช้กับตัวเชื่อมรุ่นใหม่ (แยกฝั่ง KEX / NIM) · วาง Code.txt ชุดใหม่ใน Apps Script แล้วกด Deploy › Manage deployments › แก้ไข › เวอร์ชันใหม่</div>'+h;
  m.innerHTML=h;
  bind();
}

function monthsAvailable(){

function volumeOf(m){ var v=(S.boot.volumes||[]).filter(function(x){return x.month===m;})[0]; return v && v.volume ? v.volume : null; }
function topN(rows, key, n){
  var cnt={}; rows.forEach(function(r){ var v=r[key]||'ไม่ระบุ'; cnt[v]=(cnt[v]||0)+1; });
  var arr=Object.keys(cnt).map(function(k){return {name:k,n:cnt[k]};}).sort(function(a,b){return b.n-a.n;});
  var top=arr.slice(0,n), rest=arr.slice(n).reduce(function(s,x){return s+x.n;},0);
  if(rest) top.push({name:'อื่นๆ',n:rest});
  return top;
}
function hbars(items){
  if(!items.length) return '<div class="empty">ยังไม่มีข้อมูลในเดือนนี้</div>';
  var max=Math.max.apply(null,items.map(function(i){return i.n;}));
  return items.map(function(i){ return '<div class="hbar"><span>'+esc(i.name)+'</span><div class="track" title="'+esc(i.name)+': '+i.n+' เคส"><div class="fill" style="width:'+Math.round(i.n/max*100)+'%"></div></div><span class="r" style="text-align:right"><b>'+i.n+'</b> เคส</span></div>'; }).join('');
}

var COUNT_CODES = ['A1','C1','K1','K2','K3','N2'];
function matchSt(c, cd){
  var f=cd.charAt(0);
  if(f==='K') return code(c.kex_track)===cd;
  if(f==='N') return code(c.nim_track)===cd;
  return code(c.status)===cd;
}
function viewList(){
  var L=S.list, cs=S.cases;
  var open=cs.filter(function(c){return !closed(c.status);});
  var late=open.filter(isLate);
  var counts=COUNT_CODES.map(function(k){
    var st=stOf(k);
    return { code:k, name:st?String(st.label).replace(/^\S+\s/,''):k, n:open.filter(function(c){return matchSt(c,k);}).length };
  });
  var q=L.q.trim().toLowerCase();
  var rows=cs.filter(function(c){
    if(L.st==='open' && closed(c.status)) return false;
    if(L.st!=='open' && L.st!=='all' && !matchSt(c,L.st)) return false;
    if(L.type && c.incident_type!==L.type) return false;
    if(L.src && c.source!==L.src) return false;
    if(L.owner && c.owner!==L.owner) return false;
    if(L.lateOnly && (closed(c.status) || !isLate(c))) return false;
    if(q && [c.case_id,c.tracking_no,c.nim_tracking_no,c.nim_claim_no,c.kex_claim_no,c.sender].join(' ').toLowerCase().indexOf(q)<0) return false;
    return true;

function fieldHtml(k,c,o){

  if(f.t==='date') ctl='<input type="date" id="'+id+'" data-k="'+k+'" value="'+esc(String(v).slice(0,10))+'" class="'+miss+'">';
  else if(f.t==='money') ctl='<input type="number" step="0.01" min="0" inputmode="decimal" id="'+id+'" data-k="'+k+'" value="'+esc(v)+'"'+ph+' class="'+miss+'" style="text-align:right">';

  else if(f.t==='list') ctl='<input type="text" list="dl-'+f.list+'" id="'+id+'" data-k="'+k+'" value="'+esc(v)+'" class="'+miss+'" autocomplete="off">';
  else if(f.t==='textarea') ctl='<textarea id="'+id+'" data-k="'+k+'" rows="2" class="'+miss+'">'+esc(v)+'</textarea>';

}
function fgrid(keys,c,used,o){ o=o||{}; return '<div class="fgrid">'+keys.map(function(k){ used[k]=1; return fieldHtml(k,c,o[k]); }).join('')+'</div>'; }
function abtn(act,label,cls){ return '<button type="button" class="btn '+(cls||'')+'" data-act="'+act+'">'+label+'</button>'; }
function acts(h){ return '<div class="actions">'+h+'</div>'; }
function kv(rows){ rows=rows.filter(function(r){ return r && r[1]!=null && r[1]!=='' && r[1]!=='–'; }); if(!rows.length) return ''; return '<dl class="kv">'+rows.map(function(r){ return '<div><dt>'+esc(r[0])+'</dt><dd>'+r[1]+'</dd></div>'; }).join('')+'</dl>'; }

}
function dueAmount(c){ return num(c.claim_amount)!=null ? num(c.claim_amount) : num(c.goods_value); }

/* ขั้นตอนของเคส (บนสุดของหน้า) */
function stepper(c){
  var k=code(c.status), src2=c.source===SRC[1];
  var steps = src2 ? [['N1','ลูกค้ายื่นเคลมผ่านเว็บ']] : [['O','KEX แจ้ง · เปิดเคส'],['A1','รอลูกค้ายื่นเคลม']];
  var noClaim = !src2 && k==='X4' && !c.not_eligible_reason && !c.cust_claim_date;
  if(noClaim) steps.push(['X4','ปิด · ไม่เคลม']);
  else if(k==='X5') steps.push(['X5','ปิด · ลูกค้าไม่ยื่นเคลม']);
  else {
    steps.push(['C1','พิจารณาเงื่อนไข']);
    if(k==='X4') steps.push(['X4','ปิด · ไม่เข้าเงื่อนไข']);
    else { steps.push(['C2','เคลม KEX + โอนลูกค้า']); steps.push([closed(c.status)?k:'X', closed(c.status)?String(c.status).replace(/^\S+\s/,''):'ปิดเคส']); }
  }
  var curIdx=steps.map(function(s){return s[0];}).indexOf(k), allDone=closed(c.status);
  return '<ol class="steps card">'+steps.map(function(s,idx){
    var done = allDone || idx<curIdx || s[0]==='N1' || s[0]==='O', isCur = !allDone && idx===curIdx;
    return '<li class="'+(isCur?'cur':done?'done':'')+'"><span class="dot">'+(done?'✓':isCur?'•':'')+'</span>'+esc(s[1])+'</li>';
  }).join('')+'</ol>';
}

/* กล่องขั้นปัจจุบัน — ใส่เฉพาะช่องที่ต้องใช้ในขั้นนี้ + ปุ่มยืนยัน */

  }
  if(k==='C1'){
    var gap=filingGap(c);

      note('N① ลูกค้าแจ้งเคลมเข้าระบบ NIM แล้ว'+(c.nim_claim_no?' · เลขเคลม '+esc(c.nim_claim_no):'')+(c.cust_claim_date?' · วันที่ '+fmtD(c.cust_claim_date):''),'good')+
      (lateFiling(c)?note(WARN_ICON+' ลูกค้ายื่นเคลมหลังรับสินค้า <b>'+gap+' วัน</b> (เกินกำหนด 3 วัน) — ตรวจเงื่อนไขก่อนอนุมัติ','bad'):'')+
      fgrid(['cust_claim_date','nim_claim_no','goods_received_date','not_eligible_reason'],c,used)+

  }
  if(k==='C2'){
    return tag+'<h2>กำลังเคลม · 2 ฝั่งเดินคู่กัน ไม่ต้องรอกัน</h2>'+

function lane(title, st, body, active){

function kexLane(c,used){

      fgrid(['claim_submit_date','kex_claim_no','claim_amount'],c,used,{ claim_amount:{ ph: num(c.goods_value)!=null ? c.goods_value+' (มูลค่าสินค้า)' : '' } })+

  } else if(ks==='K2'){

    b=claimInfo+(round>1?note('อุทธรณ์แล้ว · รอบเคลม '+round+' (ผลรอบก่อนดูในประวัติ)'):'')+fgrid(keys,c,used,{ approved_amount:{ hint: dec==='อนุมัติบางส่วน' ? 'ยอมรับยอด → บันทึกผล · ไม่รับยอด → ยื่นอุทธรณ์' : 'บังคับเมื่ออนุมัติ' } });
    if(appealable) b+='<div class="subhead">ถ้าจะอุทธรณ์</div>'+fgrid(['appeal_date','appeal_reason'],c,used,{ appeal_date:{noReq:true}, appeal_reason:{noReq:true} });

/* ส่วนต่างที่ NIM รับภาระ */
function burdenOf(c){
  var k=code(c.kex_track);
  if(code(c.nim_track)!=='ND' || (k!=='KD' && k!=='KX')) return 0;
  return Math.max(0,(num(c.cust_paid_amount)||0)-(k==='KD'?(num(c.kex_paid_amount)||0):0));
}
function gapNote(c){
  var bd=burdenOf(c);
  if(bd>0) return note('ส่วนต่างที่ NIM รับภาระ <b>'+money(bd)+' บาท</b> (โอนลูกค้า '+money(c.cust_paid_amount)+' · รับจาก KEX '+money(code(c.kex_track)==='KD'?c.kex_paid_amount:0)+')');
  var ap=num(c.approved_amount), cl=num(c.claim_amount);
  if(code(c.kex_track)==='K3' && ap!=null && cl!=null && ap<cl) return note('KEX อนุมัติน้อยกว่ายอดเรียกร้อง '+money(cl-ap)+' บาท — ถ้าไม่อุทธรณ์ ส่วนนี้ NIM รับภาระ');
  return '';
}
function closedPanel(c){

function infoSections(c, used){

  if(!src2) secs.push(['ผล Call Center', ['cc_action','claim_intent','cc_date']]);
  if(src2 || c.cust_claim_date || c.nim_claim_no || (k!=='A1' && k!=='X4')){
    var cu=['cust_claim_date','nim_claim_no','goods_received_date'];

var CONFIRM = {
  close_nofile:'ปิดเคสเป็น “ลูกค้าไม่ยื่นเคลม” (X5)?',
  close_noclaim:'ปิดเคสเป็น “ไม่เคลม” (X4)?',
  not_eligible:'ปิดเคสเป็น “ไม่เข้าเงื่อนไข” (X4)?',
  kex_close_reject:'ปิดฝั่ง KEX แบบ KEX ปฏิเสธ (ไม่อุทธรณ์ต่อ)?',
  nim_nopay:'ยืนยันว่า NIM ไม่จ่ายเงินลูกค้า?'
};
function submitForm(action){
  if(S.busy) return;
  if(CONFIRM[action] && !confirm(CONFIRM[action])) return;
  var fields=collectForm(), base=S.form.detail ? S.form.detail.caseData : {};
  var pick=function(){ for(var i=0;i<arguments.length;i++){ var v=arguments[i]; if(v!==''&&v!=null) return String(v); } return ''; };
  if(action==='kex_submit' && !fields.claim_amount) fields.claim_amount=pick(base.goods_value, fields.goods_value);
  if(action==='kex_paid' && !fields.kex_paid_amount) fields.kex_paid_amount=pick(base.approved_amount);
  if(action==='nim_paid' && !fields.cust_paid_amount) fields.cust_paid_amount=pick(fields.claim_amount, base.claim_amount, base.goods_value);
  S.busy=true; setBusy(true);
  S.form.draft=fields;
  api('saveCase',{ case_id:S.form.caseId, fields:fields, action:action }).then(function(r){
    S.busy=false;
    if(!r.ok){
      S.form.missing=r.missing||[]; S.form.message=r.message+(r.saved?' (ข้อมูลที่กรอกบันทึกไว้แล้ว สถานะยังไม่เปลี่ยน)':''); S.form.msgType='bad';
      if(r.saved){ S.form.draft=null; applyBundle(r); }
      render(); return;
    }
    var stTxt=r.status+(code(r.status)==='C2'?' · KEX: '+code(r.kex_track)+' · NIM: '+code(r.nim_track):'');
    toast(r.message+' · '+r.case_id);
    S.form={ caseId:r.case_id, detail:null, missing:[], message:'บันทึกแล้ว · '+stTxt, msgType:'good' };
    applyBundle(r);
    render();
    if(!S.form.detail) loadDetail(r.case_id);
  }).catch(function(e){ S.busy=false; S.form.message='บันทึกไม่สำเร็จ: '+(e.message||e); S.form.msgType='bad'; render(); });
}
function setBusy(on){ document.querySelectorAll('#main button').forEach(function(b){ b.disabled=on; }); }

/* ============================================================ reconcile */
function viewReconcile(){
  var R=S.rec;
  var claimed=S.cases.filter(function(c){ return c.kex_track || c.nim_track || num(c.claim_amount)!=null; });
  var months=uniq(claimed.map(caseMonth)).reverse();
  var rows=claimed.filter(function(c){return R.month==='all'||caseMonth(c)===R.month;});
  var sum=function(arr,f){ return arr.reduce(function(s,c){ return s+(typeof f==='function'?f(c):(num(c[f])||0)); },0); };
  var cnt=function(arr,k){return arr.filter(function(c){return num(c[k])!=null;}).length;};
  var recvAmt=function(c){ return code(c.kex_track)==='K3' ? Math.max(0,(num(c.approved_amount)||0)-(num(c.kex_paid_amount)||0)) : 0; };
  var payAmt=function(c){ return code(c.nim_track)==='N2' ? (dueAmount(c)||0) : 0; };
  var recv=rows.filter(function(c){return recvAmt(c)>0;});
  var pay=rows.filter(function(c){return payAmt(c)>0;});
  var bur=rows.filter(function(c){return burdenOf(c)>0;});
  var tC=sum(rows,'claim_amount'), tA=sum(rows,'approved_amount'), tP=sum(rows,'kex_paid_amount'), tU=sum(rows,'cust_paid_amount');
  var tiles=[['ยอดเรียกร้อง',tC,rows.length+' เคสเคลม',0],['ยอดอนุมัติ (KEX)',tA,'อนุมัติ '+cnt(rows,'approved_amount')+' เคส',0],['รับจริงจาก KEX',tP,cnt(rows,'kex_paid_amount')+' เคส',0],
    ['โอนลูกค้าแล้ว (NIM)',tU,cnt(rows,'cust_paid_amount')+' เคส',0],['ค้างรับจาก KEX',sum(recv,recvAmt),recv.length+' เคส · อนุมัติแล้วยังไม่ได้เงิน',1],
    ['ค้างโอนลูกค้า',sum(pay,payAmt),pay.length+' เคส',1],['ส่วนต่างที่ NIM รับภาระ',sum(bur,burdenOf),bur.length+' เคส · โอนลูกค้ามากกว่าที่ได้จาก KEX',1]];
  var funnel=[['ยอดเรียกร้อง',tC],['ยอดอนุมัติ',tA],['รับจริงจาก KEX',tP],['โอนลูกค้าแล้ว',tU]];
  var tabRows={ receive:recv, pay:pay, burden:bur, all:rows }[R.tab]||rows;
  var pendFn={ receive:recvAmt, pay:payAmt, burden:burdenOf, all:null }[R.tab];
  var pendLabel={ receive:'ค้างรับ', pay:'ค้างโอน', burden:'NIM รับภาระ' }[R.tab];

  var mRows=Object.keys(byM).sort().reverse().map(function(m){ var a=byM[m]; var pr=a.filter(function(c){return num(c.kex_paid_amount)!=null;});

  var tab=function(id,l,n){return '<button type="button" role="tab" data-tab="'+id+'" aria-selected="'+(R.tab===id)+'">'+l+(n!=null?' · '+n:'')+'</button>';};
  return ''+
  '<div class="head"><div class="title"><h1>กระทบยอดเงิน</h1><div class="desc">ฝั่ง KEX: เรียกร้อง → อนุมัติ → รับเงิน · ฝั่ง NIM: โอนลูกค้า (= ยอดเรียกร้อง, โอนก่อนไม่รอ KEX)</div></div>'+
  '<label class="f">เดือนที่รับรู้เคส<select id="r-month">'+opts([{v:'all',l:'ทุกเดือน'}].concat(months.map(function(m){return {v:m,l:mLabel(m)};})),R.month)+'</select></label>'+
  (S.boot.sheetUrl?'<a class="btn" href="'+esc(S.boot.sheetUrl)+'" target="_blank" rel="noopener" style="align-self:flex-end">เปิด Google Sheet</a>':'')+'</div>'+
  '<div class="grid-tiles">'+tiles.map(function(t){return '<div class="card tile'+(t[3]?' warn':'')+'"><span class="l">'+t[0]+'</span><span class="v">'+int(t[1])+'</span><span class="s">บาท · '+esc(t[2])+'</span></div>';}).join('')+'</div>'+

  (tabRows.length?'<div class="tbl-wrap"><table style="min-width:1100px"><thead><tr><th>เลขเคส</th><th>ผู้ส่ง</th><th>ฝั่ง KEX</th><th>ฝั่ง NIM</th><th>ผล KEX</th><th class="r">เรียกร้อง</th><th class="r">อนุมัติ</th><th class="r">รับจริง KEX</th><th class="r">โอนลูกค้า</th>'+(pendFn?'<th class="r">'+pendLabel+'</th>':'')+'<th>ติดตามล่าสุด</th></tr></thead><tbody>'+

    var add=$('fu-add');
    if(add) add.onclick=function(){
      if(S.busy) return;
      var p={ case_id:S.form.caseId, followup_date:$('fu-date').value, channel:$('fu-ch').value, detail:$('fu-detail').value, result:$('fu-result').value };
      if(!p.detail.trim()){ $('fu-detail').classList.add('err'); $('fu-detail').focus(); return; }
      S.busy=true; setBusy(true); S.form.draft=collectForm();
      api('addFollowup',p).then(function(r){ S.busy=false; if(!r.ok){ toast(r.message); setBusy(false); return; } toast(r.message);
        applyBundle(r); render(); if(!r.detail){ refreshCases().then(function(){ loadDetail(S.form.caseId); }); } })
      .catch(function(e){ S.busy=false; setBusy(false); toast('ไม่สำเร็จ: '+(e.message||e)); });
    };
  }
  if(S.page==='reconcile' && $('r-month')){
    $('r-month').onchange=function(e){ S.rec.month=e.target.value; render(); };
    document.querySelectorAll('[data-tab]').forEach(function(b){ b.onclick=function(){ S.rec.tab=b.dataset.tab; render(); }; });
  }
}

/* ============================================================ login + start */
function setNav(on){ document.querySelector('nav').style.display = on ? '' : 'none'; }
function showLogin(note){
  setNav(false);
  S.boot=null;
  var m=document.getElementById('main');
  m.innerHTML='<div class="card pad" style="max-width:440px;width:100%;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px">'+
    '<div><div style="font-size:20px;font-weight:700">NIM Claim · เคส KEX</div><div class="desc">เข้าสู่ระบบด้วยรหัสผ่านทีม</div></div>'+
    (note?'<div class="msg note">'+esc(note)+'</div>':'')+
    '<label class="f" for="lg-pass"><span class="lab">รหัสผ่านทีม</span><input type="password" id="lg-pass" autocomplete="current-password"></label>'+
    '<button type="button" class="btn primary" id="lg-go" style="justify-content:center">ถัดไป</button>'+
    '<div id="lg-msg"></div></div>';
  var pass=document.getElementById('lg-pass'), btn=document.getElementById('lg-go'), msg=document.getElementById('lg-msg');
  pass.focus();
  var submit=function(){
    if(!pass.value){ pass.classList.add('err'); return; }
    btn.disabled=true; msg.innerHTML='<div class="desc">กำลังตรวจสอบ…</div>';
    var tmp={ password:pass.value, user:'' };
    initCall(tmp).then(function(d){ saveSession({ password:tmp.password, user:'ทีม Claim' }); start(d); })
      .catch(function(e){ btn.disabled=false; msg.innerHTML='<div class="msg bad">'+esc(e.message)+'</div>'; });
  };
  btn.onclick=submit;
  pass.onkeydown=function(e){ if(e.key==='Enter') submit(); };
}
function start(initData){
  setNav(true);
  document.getElementById('user').textContent=SESSION.user;
  var apply=function(d){
    var first=!S.boot;
    S.boot=d.boot; S.cases=d.cases; saveCache();
    if(first) go('dashboard');
    else if(!(S.page==='form' && S.busy)) render();
  };
  if(initData){ apply(initData); return; }
  var cache=readCache();
  if(cache && cache.boot && cache.cases){ S.boot=cache.boot; S.cases=cache.cases; go('dashboard'); }
  else document.getElementById('main').innerHTML='<div class="loading">กำลังโหลดข้อมูล…</div>';
  setSync(true);
  initCall().catch(function(e){ if(e.auth){ saveSession(null); showLogin('รหัสผ่านถูกเปลี่ยน กรุณาเข้าสู่ระบบใหม่'); } throw e; }).then(function(d){ setSync(false); apply(d); }).catch(function(e){
    setSync(false);
    if(e.auth) return;
    if(S.boot){ toast('อัปเดตข้อมูลไม่สำเร็จ: '+(e.message||e)); return; }
    document.getElementById('main').innerHTML='<div class="msg bad">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message||e)+'</div><button type="button" class="btn" onclick="start()">ลองใหม่</button>';
  });
}
document.getElementById('logout').onclick=function(){ saveSession(null); try{ localStorage.removeItem(CACHE_KEY); }catch(e){} S.cases=[]; showLogin(); };

if(!API_URL){
  setNav(false);
  document.getElementById('main').innerHTML='<div class="card pad" style="max-width:640px;margin:8vh auto 0"><h2>ยังไม่ได้เชื่อม Google Sheet</h2><p class="desc">เปิดไฟล์ index.html แก้บรรทัด <span class="mono">var API_URL = \'\';</span> โดยวางลิงก์ตัวเชื่อม (Web app URL จาก Apps Script) ระหว่างเครื่องหมาย \' \' แล้วอัปโหลดขึ้น GitHub อีกครั้ง</p></div>';
} else if(SESSION && SESSION.password && SESSION.user){ start(); }
else { showLogin(); }
</script>
