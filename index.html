<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>NIM Claim · เคส KEX</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8; --card:#FFFFFF; --ink:#18212B; --ink2:#374151; --muted:#4B5563; --line:#DDE1E7; --line2:#EEF0F3;
  --input:#CDD3DB; --primary:#1F4E8C; --primary-ink:#163a69; --primary-soft:#D9E4F5;
  --claim:#FBDDB8; --claim-ink:#7C2D12; --claim-soft:#FFF4E6; --claim-line:#F0C99A;
  --gray-soft:#EBEDF0; --red:#B91C1C; --red-soft:#FDE2E1; --nav:#18212B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;font-size:15px;line-height:1.5}
a{color:var(--primary)}a:hover{color:var(--primary-ink)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:13px}
.app{min-height:100vh;display:flex;flex-wrap:wrap}
nav{flex:1 1 232px;max-width:100%;background:var(--nav);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:4px}
nav .brand{font-size:18px;font-weight:700;padding:0 12px 2px}
nav .sub{font-size:13px;color:#AEB6C2;padding:0 12px 20px}
nav button{all:unset;display:block;padding:12px;border-radius:8px;color:#C9D3E0;font-size:15px;cursor:pointer}
nav button:hover{background:#243243}
nav button[aria-current="page"]{background:#2B3A4C;color:#fff;font-weight:600}
nav button:focus-visible{outline:2px solid #9DB4D6}
nav button:disabled{opacity:.5;cursor:wait}
nav .user{margin-top:auto;font-size:12px;color:#AEB6C2;padding:16px 12px 0;word-break:break-all}
main{flex:999 1 560px;min-width:0;padding:32px 40px;display:flex;flex-direction:column;gap:24px}
@media (max-width:700px){main{padding:20px 16px}nav{flex-direction:row;flex-wrap:wrap;padding:12px}nav .sub,nav .user{display:none}}
h1{margin:0;font-size:28px;line-height:38px}
h2{margin:0;font-size:17px;line-height:24px}
h3{margin:0;font-size:17px;line-height:24px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px}
.head .title{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.desc{font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:20px 24px}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{padding:16px;display:flex;flex-direction:column;gap:4px}
.tile .l{font-size:13px;color:var(--ink2)} .tile .v{font-size:26px;line-height:34px;font-weight:700} .tile .s{font-size:12px;color:var(--muted)}
.tile.warn{background:var(--claim-soft);border-color:var(--claim-line)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f .lab{font-size:14px;font-weight:600;color:var(--ink)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--input);border-radius:8px}
input,select{height:44px;padding:0 12px}
textarea{padding:10px 12px;min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
input[readonly]{background:var(--bg)}
.err{border-color:var(--red)!important;background:#FFF7F7!important}
.btn{font:inherit;font-size:15px;height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--input);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--primary-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.claim{border-color:#B45309;color:var(--claim-ink);font-weight:600}
.btn:disabled{opacity:.55;cursor:wait}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);background:#FAFBFC;padding:12px 16px;border-bottom:1px solid #E5E8EC;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:top}
td.r,th.r{text-align:right}
td.who{min-width:150px}td.nw{white-space:nowrap}
tr.late td{background:#FFF7F7}
.late-flag{color:var(--red);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.linkbtn{all:unset;white-space:nowrap;color:var(--primary);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--primary)}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.count{all:unset;box-sizing:border-box;min-height:76px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.count:focus-visible{outline:2px solid var(--primary)}
.count[aria-pressed="true"]{border:2px solid var(--primary)}
.count .c{font-size:12px;font-weight:600} .count .n{font-size:13px;color:var(--ink2)} .count .v{font-size:22px;font-weight:700}
.cgroups{display:flex;flex-wrap:wrap;gap:16px 24px}.cg{display:flex;flex-direction:column;gap:6px}.cg .gl{font-size:13px;font-weight:600;color:var(--muted)}.cgrow{display:flex;flex-wrap:wrap;gap:10px}.cg{flex:1 1 100%}.cgrow .count{width:128px}
.count.sla{background:var(--red-soft);border-color:#F5B5B1}.count.sla .c{color:var(--red)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.check{display:flex;align-items:center;gap:8px;height:44px;font-size:14px}
.check input{width:18px;height:18px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:220px;border-bottom:1px solid var(--input);padding-top:24px}
.bars .col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.bars .col .bar{width:100%;max-width:32px;border-radius:4px 4px 0 0;background:#9DB4D6}
.bars .col .bar.cur{background:var(--primary)}
.bars .col .val{font-size:12px;font-weight:600}
.xlab{display:flex;gap:8px}.xlab span{flex:1 1 0;text-align:center;font-size:12px;color:var(--muted);min-width:0}
.hbar{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) 72px;gap:12px;align-items:center;font-size:14px}
.hbar .track{height:16px;background:var(--line2);border-radius:4px}
.hbar .fill{height:16px;background:var(--primary);border-radius:0 4px 4px 0}
.split{display:flex;height:16px;gap:2px}
.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--input);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:none;background:#fff;padding:0 14px;height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 0;border-bottom:1px solid #E5E8EC}
.tabs button{font:inherit;font-size:15px;height:44px;padding:0 16px;border:none;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{border-bottom-color:var(--primary);color:var(--primary);font-weight:600}
.steps{list-style:none;margin:0;padding:16px 20px;display:flex;flex-wrap:wrap;gap:8px 4px}
.steps li{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;font-size:13px;background:var(--bg);color:var(--muted)}
.steps li .dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:#fff;font-size:12px;font-weight:600}
.steps li.done{background:#EEF2F8;color:var(--primary-ink)} .steps li.done .dot{background:var(--primary)}
.steps li.cur{background:var(--primary);color:#fff;font-weight:600} .steps li.cur .dot{background:#fff;color:var(--primary)}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cols .left{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.cols .right{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px}
.sec{padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.sec.current{border:2px solid var(--primary)}
.sec .tag{font-size:13px;font-weight:600;color:var(--primary)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.msg{padding:12px 14px;border-radius:8px;font-size:14px}
.msg.bad{background:var(--red-soft);color:var(--red)}
.msg.good{background:#E6F0FA;color:var(--primary-ink)}
.msg.note{background:var(--claim-soft);color:var(--claim-ink)}
.timeline{list-style:none;margin:0;padding:14px 0 0;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:12px}
.timeline li{display:flex;flex-direction:column;gap:2px;font-size:14px}
.timeline .m{font-size:12px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;display:none;z-index:10}
.loading{padding:64px;text-align:center;color:var(--muted)}
@media print{nav,.no-print{display:none!important}main{padding:0}body{background:#fff}.card{break-inside:avoid}}
.chipset{display:inline-flex;flex-wrap:wrap;gap:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px;margin:0}
.kv div{display:flex;flex-direction:column;gap:2px}.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:0;font-weight:600;font-size:14px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.lane{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;background:#FCFCFD}
.lane.active{border:2px solid #B45309;background:#fff}
.subhead{font-size:13px;font-weight:600;color:var(--claim-ink);border-top:1px dashed var(--line);padding-top:10px}
details.sec summary{cursor:pointer;font-weight:600;font-size:16px;list-style-position:outside}
details.sec:not([open]){padding-top:14px;padding-bottom:14px}
.msg svg{vertical-align:-2px}
.dsec{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;border-top:2px solid var(--ink);padding-top:12px;margin-top:12px}.dsec .n{font-weight:700;color:var(--primary);font-size:17px}.dsec h2{font-size:19px}
.g4t{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.dg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:12px}
.dg4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:12px}.dtop{min-width:0}
.dtop h3{font-size:15px;margin-bottom:6px}
table.mini td,table.mini th{padding:6px 8px;font-size:13px}.mini .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}table.mini.fixed{table-layout:fixed}table.mini.fixed .nm{max-width:none}.pb{background:var(--line2);border-radius:4px;height:10px}.pb i{display:block;height:100%;border-radius:4px}
tr.oth td{color:var(--muted);font-style:italic}tr.tot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
[data-drill]{cursor:pointer}[data-drill]:hover{background:#F2F6FC}[data-drill]:focus-visible{outline:2px solid var(--primary)}
.tile[data-drill]:hover{border-color:var(--primary)}
.go{color:var(--primary);font-weight:600}.up{color:var(--red);font-weight:600}.dn{color:#15803D;font-weight:600}.sla{color:var(--red);font-weight:700}
.dbars{display:flex;align-items:flex-end;gap:16px;height:250px;border-bottom:1px solid var(--input);padding-top:20px;overflow-x:auto}
.dbars .col{all:unset;cursor:pointer;flex:0 0 56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;position:relative;padding-bottom:22px}
.dbars .col:focus-visible{outline:2px solid var(--primary)}
.dbars .stk{width:40px;display:flex;flex-direction:column;border-radius:4px 4px 0 0;overflow:hidden}
.dbars .col.cur .stk{outline:2px solid var(--ink);outline-offset:2px}
.dbars .val{font-size:12px;font-weight:600}.dbars .xl1{position:absolute;bottom:0;font-size:12px;color:var(--muted);white-space:nowrap}.dbars .col.cur .xl1{color:var(--ink);font-weight:700}
.frow{display:grid;grid-template-columns:minmax(150px,260px) minmax(0,1fr) 50px 64px;gap:12px;align-items:center;padding:7px 4px;font-size:14px;border-bottom:1px solid var(--line2)}
.frow.fhead{font-size:12px;color:var(--muted);border:0;padding-top:0;cursor:default}.frow.l1 .fl{padding-left:16px}.frow.l2 .fl{padding-left:36px;color:var(--ink2)}
.ftrack{background:var(--line2);height:14px;border-radius:4px}.ftrack div{height:100%;border-radius:4px}.fn{text-align:right}.fp{text-align:right;color:var(--ink2)}
.fsub{font-size:13px;color:var(--claim-ink);background:var(--claim-soft);border-radius:6px;padding:6px 10px;margin:2px 0 4px 56px;line-height:1.7}.fsub.grey{background:#F3F4F6;color:var(--ink2)}
.fsub [data-drill]{text-decoration:underline dotted;text-underline-offset:3px}
.dmoney{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}.dmoney .tile{flex:1 1 150px}.darr{align-self:center;color:#9AA3AE;font-size:20px}
.dlate{font-size:13px;margin-bottom:8px}
.legend [data-drill]{padding:2px 4px;border-radius:4px}
.sumtbl .nm{max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sumtbl.fx{table-layout:fixed;min-width:430px}.sumtbl.fx .nm{max-width:none}.sumtbl.fx td,.sumtbl.fx th{padding:8px 6px}.sumtbl .nm2{min-width:180px}.sumtbl td.r,.sumtbl th.r{white-space:nowrap}
.sumtbl tr.zero td{color:#9AA3AE}.sumtbl tr.top td{background:var(--claim-soft)}.sumtbl tr.rep td{background:#FFFAFA}
.tagx{font-size:11px;color:#B45309;background:var(--claim-soft);border-radius:4px;padding:1px 6px}.tagr{font-size:11px;color:var(--red);background:var(--red-soft);border-radius:4px;padding:1px 6px}
.xt td,.xt th{padding:7px 8px;font-size:13px}.xt td.cx,.xt td.c0{text-align:center;font-weight:600;border:2px solid var(--card);border-radius:4px}.xt td.c0{color:#C8CDD4}.xt .nm{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.xt tfoot td{font-weight:700;border-top:2px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(24,33,43,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.mbox{width:min(900px,100%);padding:18px 20px;max-height:90vh;display:flex;flex-direction:column}
.only-img{display:none}.img-mode .only-img{display:block}
@media (max-width:700px){.frow{grid-template-columns:minmax(120px,1fr) 60px 40px 56px}.frow.l2 .fl{padding-left:16px}.fsub{margin-left:12px}.darr{display:none}}
.sumtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.sumtiles .tile.main{background:var(--primary-soft);border-color:#B8CBE8}
.tile .v small{font-size:15px;color:var(--red);margin-left:8px;font-weight:700}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:16px;align-items:start}
.sumtbl td,.sumtbl th{padding:9px 12px}
.sumtbl .pbar{background:var(--line2);border-radius:4px;height:12px;min-width:90px}
.sumtbl .pbar i{display:block;height:100%;background:var(--primary);border-radius:4px}
.sumtbl tr.top td{background:var(--claim-soft)} .sumtbl tr.top .pbar i{background:#C2410C}
.sumtbl tr.zero td{color:#9AA3AE}
.sumtbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
.missing{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--claim-ink);background:var(--claim-soft);border:1px solid var(--claim-line);border-radius:999px;padding:2px 10px}
</style>
</head>
<body>
<div class="app">
  <nav aria-label="เมนูหลัก">
    <div class="brand">NIM Claim</div>
    <div class="sub">เคสเสียหาย / สูญหาย · KEX</div>
    <button type="button" data-page="dashboard">Dashboard KEX</button>
    <button type="button" data-page="list">รายการเคส</button>
    <button type="button" data-page="form">เปิดเคสใหม่</button>
    <button type="button" data-page="summary">สรุปรายเดือน KEX</button>
    <button type="button" data-page="reconcile">กระทบยอดเงิน</button>
    <button type="button" id="refresh" title="ดึงข้อมูลล่าสุดจาก Google Sheet" style="margin-top:12px;border:1px solid #3A4A5E;display:flex;align-items:center;gap:8px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" stroke-linecap="round"/><path d="M12.5 1.8v2.6H9.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>รีเฟรชข้อมูล</span></button>
    <div id="synced" style="font-size:12px;color:#AEB6C2;padding:4px 12px 0"></div>
    <div class="user"><span id="user"></span><br><button type="button" id="logout" style="padding:8px 0;font-size:12px;text-decoration:underline">ออกจากระบบ</button></div>
  </nav>
  <main id="main"><div class="loading">กำลังโหลดข้อมูล…</div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="sync" role="status" aria-live="polite" style="position:fixed;right:16px;top:12px;display:none;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);z-index:9">กำลังอัปเดตข้อมูลล่าสุด…</div>

<script>
/* ============================================================ ตั้งค่า
   วางลิงก์ตัวเชื่อม (Web app URL ที่ได้จาก Deploy ใน Apps Script ของ Google Sheet) ระหว่างเครื่องหมาย ' '
   ตัวอย่าง: var API_URL = 'https://script.google.com/macros/s/xxxxxxxx/exec';            */
var API_URL = 'https://script.google.com/macros/s/AKfycbysidAobNhvSIdrAdhOPGV1YMCrupAxJOzglVJyLYLZJGOv20Q4fdYngtSxB9rqBmWiRA/exec';
var S = {
  boot: null, cases: [], page: 'dashboard',
  list: { st: 'open', close: '', q: '', type: '', src: '', owner: '', lateOnly: false },
  dash: { month: null, metric: 'count' },
  rec: { month: 'all', tab: 'receive' },
  sum: { month: null },
  form: { caseId: null, detail: null, missing: [], message: '', msgType: '' },
  busy: false
};

/* ช่องทางรับรู้เคส (ต้องตรงกับตัวเชื่อม) */
var SRC = ['KEX แจ้ง (Email)', 'ลูกค้ายื่นเคลม (เว็บ NIM)'];
function srcShort(s){ return s===SRC[1] ? 'ลูกค้ายื่นเอง' : (s===SRC[0] ? 'KEX แจ้ง' : '–'); }

/* ช่องข้อมูลทั้งหมด: key → { l: ชื่อ, t: ชนิด, list, hint, wide } */
var FD = {
  source:{ l:'ช่องทางรับรู้เคส', t:'select', list:'source' },
  owner:{ l:'ผู้รับผิดชอบ', t:'list', list:'owner' },
  kex_notice_date:{ l:'วันที่ KEX แจ้ง (Email)', t:'date' },
  cust_claim_date:{ l:'วันที่ลูกค้ายื่นเคลม (เว็บ NIM)', t:'date' },
  nim_claim_no:{ l:'เลขเคลม NIM', t:'text' },

var TASK = { A1:'รอลูกค้ายื่นเคลม', C1:'รอพิจารณาเงื่อนไข', K1:'รอแจ้งเคลม KEX', K2:'รอผล KEX', K2A:'รอผลอุทธรณ์ KEX', K3:'รอเงิน KEX', N2:'รอโอนลูกค้า' };

/* สถานะฝั่ง KEX ที่แสดง: รอผล KEX หลังยื่นอุทธรณ์ (รอบเคลม > 1) = รอผลอุทธรณ์ KEX */
function kexCode(c){ var k=code(c.kex_track); return (k==='K2' && num(c.claim_round)>1) ? 'K2A' : k; }
/* งานที่ค้างของเคส (ระหว่างเคลมอาจมี 2 งานพร้อมกัน: ฝั่ง KEX + ฝั่ง NIM) */
function tasksOf(c){
  var k=code(c.status);
  if(k==='A1'||k==='C1') return [k];
  if(k!=='C2') return [];

  if(TASK[ks]) t.push(ks); if(TASK[ns]) t.push(ns);

function chips(c, all){
  var h;
  if(closed(c.status)) h=chip(c.status);
  else h=tasksOf(c).map(function(t){ return chip(t); }).join('');
  if(all && code(c.status)==='C2'){ [c.kex_track,c.nim_track].forEach(function(t){ if(DONE[code(t)]) h+=chip(t); }); }
  return '<span class="chipset">'+h+'</span>';
}
/* SLA: นับวันในขั้นที่กำลังรอ (ฝั่งเคส / KEX / NIM) เทียบกับ SLA ในชีต Lists */
function slaItems(c){
  var k=code(c.status), out=[];
  var add=function(cd, from){
    var st=stOf(cd==='K2A'?'K2':cd), sla=(st && st.sla!=null && st.sla!=='') ? Number(st.sla) : null, d=daysSince(from);
    out.push({ code:cd, days:d, sla:sla, late: sla!=null && d!=null && d>sla });
  };
  if(k==='C1') add(k, c.status_changed_at);
  else if(k==='A1') add(k, c.goods_received_date || c.status_changed_at);
  else if(k==='C2'){
    var ks=code(c.kex_track), ns=code(c.nim_track);
    if(ks==='K1') add('K1', c.cust_claim_date || c.kex_track_at);
    else if(ks==='K2'||ks==='K3') add(kexCode(c), c.kex_track_at);
    if(ns==='N2') add('N2', c.nim_track_at);
  }
  return out;
}

function loadDetail(id){

function fieldHtml(k,c,o){
  var f=FD[k]||{ l:k, t:'text' }; o=o||{};
  var v=c[k]; v=(v==null)?'':v;
  var miss=S.form.missing.indexOf(k)>=0 ? ' err' : '';
  var req=REQ.indexOf(k)>=0 && !o.noReq ? ' *' : '';
  var id='f-'+k, ctl, ph=o.ph ? ' placeholder="'+esc(o.ph)+'"' : '';
  if(f.t==='month') ctl='<input type="month" id="'+id+'" data-k="'+k+'" value="'+esc(String(v).slice(0,7))+'" class="'+miss+'">';
  else if(f.t==='date') ctl='<input type="date" id="'+id+'" data-k="'+k+'" value="'+esc(String(v).slice(0,10))+'" class="'+miss+'">';
  else if(f.t==='money') ctl='<input type="number" step="0.01" min="0" inputmode="decimal" id="'+id+'" data-k="'+k+'" value="'+esc(v)+'"'+ph+' class="'+miss+'" style="text-align:right">';
  else if(f.t==='select') ctl='<select id="'+id+'" data-k="'+k+'" class="'+miss+'">'+opts(S.boot.lists[f.list]||[],v,'— เลือก —')+'</select>';
  else if(f.t==='list') ctl='<input type="text" list="dl-'+f.list+'" id="'+id+'" data-k="'+k+'" value="'+esc(v)+'" class="'+miss+'" autocomplete="off">';
  else if(f.t==='textarea') ctl='<textarea id="'+id+'" data-k="'+k+'" rows="2" class="'+miss+'">'+esc(v)+'</textarea>';
  else if(f.t==='readonly') ctl='<input type="text" id="'+id+'" value="'+esc(v===''?'–':v)+'" readonly>';
  else ctl='<input type="text" id="'+id+'" data-k="'+k+'" value="'+esc(v)+'" class="'+miss+'">';
  var hint=o.hint!=null ? o.hint : f.hint;
  return '<label class="f'+(f.wide?' wide':'')+'" for="'+id+'"><span class="lab">'+esc(o.l||f.l)+req+'</span>'+ctl+(hint?'<span style="font-size:12px">'+esc(hint)+'</span>':'')+'</label>';
}
function fgrid(keys,c,used,o){ o=o||{}; return '<div class="fgrid">'+keys.map(function(k){ used[k]=1; return fieldHtml(k,c,o[k]); }).join('')+'</div>'; }
function abtn(act,label,cls){ return '<button type="button" class="btn '+(cls||'')+'" data-act="'+act+'">'+label+'</button>'; }
function acts(h){ return '<div class="actions">'+h+'</div>'; }
function kv(rows){ rows=rows.filter(function(r){ return r && r[1]!=null && r[1]!=='' && r[1]!=='–'; }); if(!rows.length) return ''; return '<dl class="kv">'+rows.map(function(r){ return '<div><dt>'+esc(r[0])+'</dt><dd>'+r[1]+'</dd></div>'; }).join('')+'</dl>'; }
function note(t,cls){ return '<div class="msg '+(cls||'note')+'">'+t+'</div>'; }
function datalists(){
  return Object.keys(S.boot.lists).map(function(k){ return '<datalist id="dl-'+k+'">'+(S.boot.lists[k]||[]).map(function(i){return '<option value="'+esc(i)+'">';}).join('')+'</datalist>'; }).join('');
}
function dueAmount(c){ return num(c.claim_amount)!=null ? num(c.claim_amount) : num(c.goods_value); }
/* ยอดที่ KEX โอนเกิน = รับจริง − ยอดที่น้อยกว่าระหว่างยอดเรียกร้องกับยอดอนุมัติ */
function overpayBase(c){ var b=[num(c.claim_amount),num(c.approved_amount)].filter(function(x){return x!=null;}); return b.length ? Math.min.apply(null,b) : null; }
function overpay(c){ var p=num(c.kex_paid_amount), b=overpayBase(c); return (p!=null && b!=null && p>b) ? Math.round((p-b)*100)/100 : 0; }
function overpayOpen(c){ return overpay(c)>0 && !c.overpay_action; }
/* ยอดรับจาก KEX สำหรับคิดอัตราได้รับชดเชย (ไม่นับส่วนที่โอนเกิน) */
function kexPaidCapped(c){ return Math.max(0,(num(c.kex_paid_amount)||0)-overpay(c)); }
function overpaySec(c, used){
  var o=overpay(c); if(!o) return '';
  var done=!!c.overpay_action;
  return '<section class="card sec"'+(done?'':' style="border:2px solid #B45309"')+'><span class="tag" style="color:var(--claim-ink)">'+(done?'จัดการยอดโอนเกินแล้ว':'รอจัดการ')+'</span>'+
    '<h2>KEX โอนเกิน '+money(o)+' บาท</h2>'+
    '<div class="desc" style="font-size:13px">รับจริง '+money(c.kex_paid_amount)+' · ยอดเรียกร้อง '+money(c.claim_amount)+(num(c.approved_amount)!=null?' · ยอดอนุมัติ '+money(c.approved_amount):'')+' · เคสปิดได้ตามปกติ ยอดนี้ติดตามในหน้ากระทบยอดเงิน · ระหว่างรอ KEX ตอบ จดใน “บันทึกการติดตาม”</div>'+
    fgrid(['overpay_action','overpay_date','overpay_note'],c,used)+acts(abtn('save','บันทึกการจัดการยอดโอนเกิน'))+'</section>';
}

/* ขั้นตอนของเคส (บนสุดของหน้า) */
function stepper(c){
  var k=code(c.status), src2=c.source===SRC[1];
  var steps = (src2 && !c.nim_claim_no) ? [['O','ลูกค้าแจ้ง · เปิดเคส'],['A1','รอใส่เลขเคลม NIM']]
    : src2 ? [['N1','ลูกค้ายื่นเคลมผ่านเว็บ']] : [['O','KEX แจ้ง · เปิดเคส'],['A1','รอลูกค้ายื่นเคลม']];
  var early = !src2 && (k==='X4'||k==='X6') && !c.cust_claim_date;
  if(early) steps.push([k,'ปิด · '+CLOSE[k]]);
  else if(k==='X5') steps.push(['X5','ปิด · ลูกค้าไม่ยื่นเคลม']);
  else {
    steps.push(['C1','พิจารณาเงื่อนไข']);
    if(k==='X4'||k==='X6') steps.push([k,'ปิด · '+CLOSE[k]]);
    else { steps.push(['C2','เคลม KEX + โอนลูกค้า']); steps.push([closed(c.status)?k:'X', closed(c.status)?String(c.status).replace(/^\S+\s/,''):'ปิดเคส']); }
  }
  var curIdx=steps.map(function(s){return s[0];}).indexOf(k), allDone=closed(c.status);
  return '<ol class="steps card">'+steps.map(function(s,idx){
    var done = allDone || idx<curIdx || s[0]==='N1' || s[0]==='O', isCur = !allDone && idx===curIdx;
    return '<li class="'+(isCur?'cur':done?'done':'')+'"><span class="dot">'+(done?'✓':isCur?'•':'')+'</span>'+esc(s[1])+'</li>';
  }).join('')+'</ol>';
}

/* กล่องขั้นปัจจุบัน — ใส่เฉพาะช่องที่ต้องใช้ในขั้นนี้ + ปุ่มยืนยัน */
function stepPanel(c, used){
  var k=code(c.status);
  var tag='<span class="tag">งานที่ค้าง · '+esc(tasksOf(c).map(function(t){return TASK[t];}).join(' + ') || nameOf(c.status))+'</span>';
  if(k==='A1'){
    var gr=c.goods_received_date, d=gr?daysSince(gr):null, w;
    if(gr && d>3) w=note(WARN_ICON+' ลูกค้ารับสินค้าเมื่อ '+fmtD(gr)+' ผ่านมา '+d+' วัน <b>เกินกำหนด 3 วันแล้ว</b> — ถ้าลูกค้าไม่ยื่น กด “ปิด · ลูกค้าไม่ยื่นเคลม” ได้','bad');
    else if(gr) w=note('ลูกค้ารับสินค้าเมื่อ '+fmtD(gr)+' · ยื่นเคลมได้อีก '+Math.max(0,3-d)+' วัน','good');
    else w=note('ใส่วันที่ลูกค้ารับสินค้า เพื่อนับกำหนดยื่นเคลม 3 วัน');
    return tag+'<h2>รอลูกค้ายื่นเคลมผ่านเว็บ NIM</h2>'+w+
      '<div class="subhead" style="border:none;padding:0;color:var(--primary-ink)">ลูกค้ายื่นเคลมแล้ว</div>'+
      fgrid(['cust_claim_date','nim_claim_no','goods_received_date','goods_value'],c,used,{ goods_value:{ noReq:true, hint:'ตามที่ลูกค้ายื่นเคลม' } })+
      acts(abtn('customer_filed','ลูกค้ายื่นเคลมแล้ว → พิจารณาเงื่อนไข','primary'))+
      '<div class="subhead">ปิดเคสก่อนเริ่มเคลม</div>'+

      '<div class="desc" style="font-size:13px">ไม่เคลม = ลูกค้าไม่ประสงค์เคลม · ไม่เข้าเงื่อนไข = ทีม Claim ตรวจแล้วไม่ผ่าน · ลูกค้าไม่ยื่นเคลม = เกินกำหนดแล้วไม่ยื่น</div>';

      acts(abtn('eligible','เข้าเงื่อนไข → เริ่มเคลม','primary')+abtn('not_eligible','ไม่เข้าเงื่อนไข → ปิดเคส','dark')+abtn('save','บันทึก'));

function lane(title, st, body, active){

function kexLane(c,used){
  var ks=code(c.kex_track), dec=c.kex_decision, round=num(c.claim_round)||1, b='';
  var claimInfo=kv([['รอบเคลม',round],['วันที่แจ้งเคลม KEX',fmtD(c.claim_submit_date)],['เลขเคลม KEX',esc(c.kex_claim_no)],['ยอดเรียกร้อง',money(c.claim_amount)]]);
  if(ks==='K1'){
    b='<div class="desc" style="font-size:13px">แจ้งเคลมเข้าระบบ KEX ภายใน 1 วันหลังลูกค้ายื่นเคลม</div>'+
      fgrid(['claim_submit_date','kex_claim_no','claim_amount'],c,used,{ claim_amount:{ ph: num(c.goods_value)!=null ? c.goods_value+' (มูลค่าสินค้า)' : '' } })+
      acts(abtn('kex_submit','แจ้งเคลม KEX แล้ว','primary'))+
      '<div class="subhead">ไม่เคลม KEX</div><div class="desc" style="font-size:13px">ใช้เมื่อเคลม KEX ไม่ได้ เช่น สินค้าที่ KEX ไม่รับเคลม หรือความผิดฝั่ง NIM · ฝั่ง KEX ปิด แล้ว NIM โอนลูกค้าเอง · โอนแล้วเคสปิดเป็น “NIM จ่ายเอง (ไม่เคลม KEX)”</div>'+
      fgrid(['reject_reason'],c,used,{ reject_reason:{ l:'เหตุผลที่ไม่เคลม KEX', noReq:true, hint:'บังคับเมื่อกด “ไม่เคลม KEX”' } })+
      acts(abtn('kex_noclaim','ไม่เคลม KEX (NIM รับภาระ)','dark'));
  } else if(ks==='K2'){
    var appealable = dec==='ปฏิเสธ' || dec==='อนุมัติบางส่วน';
    var keys=['kex_decision','kex_decision_date'];
    if(dec!=='ปฏิเสธ') keys.push('approved_amount');
    if(appealable) keys.push('reject_reason');
    b=claimInfo+(round>1?note('อุทธรณ์แล้ว · รอบเคลม '+round+' (ผลรอบก่อนดูในประวัติ)'):'')+fgrid(keys,c,used,{ approved_amount:{ hint: dec==='อนุมัติบางส่วน' ? 'ยอมรับยอด → บันทึกผล · ไม่รับยอด → ยื่นอุทธรณ์' : 'บังคับเมื่ออนุมัติ' } });
    if(appealable) b+='<div class="subhead">ถ้าจะอุทธรณ์</div>'+fgrid(['appeal_date','appeal_reason'],c,used,{ appeal_date:{noReq:true}, appeal_reason:{noReq:true} });
    var bt='';
    if(dec!=='ปฏิเสธ') bt+=abtn('kex_result','บันทึกผล KEX (อนุมัติ)','primary');
    if(appealable) bt+=abtn('kex_appeal','ยื่นอุทธรณ์ (รอบ '+(round+1)+')','claim');
    if(dec==='ปฏิเสธ') bt+=abtn('kex_close_reject','ปิดฝั่ง KEX · ปฏิเสธ','dark');
    b+=acts(bt);
  } else if(ks==='K3'){
    b=kv([['ผลพิจารณา',esc(dec)],['วันที่ได้ผล',fmtD(c.kex_decision_date)],['ยอดเรียกร้อง',money(c.claim_amount)],['ยอดอนุมัติ',money(c.approved_amount)]])+
      fgrid(['kex_paid_date','kex_paid_amount','kex_payment_ref'],c,used,{ kex_paid_amount:{ ph: num(c.approved_amount)!=null ? c.approved_amount+' (ยอดอนุมัติ)' : '' } });
    var bt3=abtn('kex_paid','ได้รับเงิน KEX แล้ว','primary');
    if(dec==='อนุมัติบางส่วน'){
      b+='<div class="subhead">ไม่รับยอด · ยื่นอุทธรณ์</div>'+fgrid(['appeal_date','appeal_reason'],c,used,{ appeal_date:{noReq:true}, appeal_reason:{noReq:true} });
      bt3+=abtn('kex_appeal','ไม่รับยอด · ยื่นอุทธรณ์ (รอบ '+(round+1)+')','claim');
    }
    b+=acts(bt3);
  } else if(ks==='KD'){
    b=kv([['ผลพิจารณา',esc(dec)],['ยอดอนุมัติ',money(c.approved_amount)],['วันที่รับเงิน',fmtD(c.kex_paid_date)],['ยอดรับจริง',money(c.kex_paid_amount)]])+'<div class="desc">ฝั่ง KEX เสร็จแล้ว</div>';
  } else if(ks==='KN'){
    b=kv([['เหตุผลที่ไม่เคลม KEX',esc(c.reject_reason)]])+'<div class="desc">ไม่เคลม KEX · NIM รับภาระเอง</div>';
  } else if(ks==='KX'){
    b=kv([['ผลพิจารณา',esc(dec)],['วันที่ได้ผล',fmtD(c.kex_decision_date)],['เหตุผล',esc(c.reject_reason)],['รอบเคลม',round]])+'<div class="desc">KEX ปฏิเสธ · ปิดฝั่ง KEX แล้ว</div>';
  } else {
    b='<div class="desc">ยังไม่เริ่มฝั่ง KEX</div>';
  }
  return lane('เคลมกับ KEX', kexCode(c), b, ['K1','K2','K3'].indexOf(ks)>=0);
}
function nimLane(c,used){

  } else if(ns==='ND'){
    b=kv([['วันที่โอน',fmtD(c.cust_paid_date)],['ยอดโอนลูกค้า',money(c.cust_paid_amount)]])+'<div class="desc">โอนเงินลูกค้าเสร็จแล้ว</div>';
  } else if(ns==='NX'){

/* ส่วนต่างที่ NIM รับภาระ */
function burdenOf(c){
  var k=code(c.kex_track);
  if(code(c.nim_track)!=='ND' || (k!=='KD' && k!=='KX' && k!=='KN')) return 0;
  return Math.max(0,(num(c.cust_paid_amount)||0)-(k==='KD'?(num(c.kex_paid_amount)||0):0));
}
function gapNote(c){
  var bd=burdenOf(c);
  if(bd>0) return note('ส่วนต่างที่ NIM รับภาระ <b>'+money(bd)+' บาท</b> (โอนลูกค้า '+money(c.cust_paid_amount)+' · รับจาก KEX '+money(code(c.kex_track)==='KD'?c.kex_paid_amount:0)+')');
  var ap=num(c.approved_amount), cl=num(c.claim_amount);
  if(code(c.kex_track)==='K3' && ap!=null && cl!=null && ap<cl) return note('KEX อนุมัติน้อยกว่ายอดเรียกร้อง '+money(cl-ap)+' บาท — ถ้าไม่อุทธรณ์ ส่วนนี้ NIM รับภาระ');
  return '';
}
function closedPanel(c, used){
  var k=code(c.status), rows=[['ปิดเมื่อ',fmtD(c.closed_at)]];
  if(k==='X1'||k==='X2'||k==='X3') rows=rows.concat([['ยอดเรียกร้อง',money(c.claim_amount)],['รับจาก KEX',money(c.kex_paid_amount)],['โอนลูกค้า',money(c.cust_paid_amount)]]);
  if(k==='X7') rows=rows.concat([['เหตุผลที่ไม่เคลม KEX',esc(c.reject_reason)],['โอนลูกค้า (NIM รับภาระ)',money(c.cust_paid_amount)]]);
  if(k==='X4'||k==='X6') rows.push(['เหตุผล',esc(c.not_eligible_reason || c.claim_intent)],['ความประสงค์ผู้รับ',esc(c.cc_action)]);
  var re='';
  if(['X4','X5','X6'].indexOf(k)>=0 && !c.kex_track){
    re='<div class="subhead">ลูกค้ายื่นเคลมเข้ามา · พิจารณาใหม่</div>'+
      '<div class="desc" style="font-size:13px">เคสนี้ปิดก่อนเริ่มเคลม ถ้าลูกค้ายื่นเคลมผ่านเว็บ NIM ภายหลัง (เช่น มีหลักฐานเพิ่ม) กดพิจารณาใหม่ได้ · เคสจะกลับไปรอพิจารณาเงื่อนไข · ผลการปิดครั้งนี้ยังเก็บในประวัติ</div>'+
      fgrid(['cust_claim_date','nim_claim_no','goods_received_date','goods_value'],c,used,{ goods_value:{ noReq:true, hint:'ตามที่ลูกค้ายื่นเคลม' } })+
      acts(abtn('reopen','ลูกค้ายื่นเคลม → พิจารณาใหม่','primary'));
  }
  return '<span class="tag">ปิดเคสแล้ว</span><h2>'+esc(nameOf(c.status))+'</h2>'+kv(rows)+gapNote(c)+acts(abtn('save','บันทึกการแก้ไข'))+re;

/* หมวดข้อมูลเคส (พับไว้) — ไม่ซ้ำกับช่องในกล่องขั้นปัจจุบัน */
function infoSections(c, used){
  var k=code(c.status), src2=c.source===SRC[1];
  var secs=[];
  secs.push(['ข้อมูลเคส · เหตุการณ์', ['owner'].concat(src2?[]:['kex_notice_date'], ['tracking_no','nim_tracking_no','bill_date','kex_send_date','incident_type','damage_type','cause','incident_location','origin_dc','sender','product_desc','product_group','size','goods_value','incident_detail','report_month'])]);
  if(!src2) secs.push(['ตรวจเงื่อนไขเบื้องต้น', ['prescreen'].concat(['cc_action','claim_intent','cc_date'].filter(function(x){ return c[x]; }))]);
  if(src2 || c.cust_claim_date || c.nim_claim_no || (k!=='A1' && k!=='X4' && k!=='X6')){
    var cu=['cust_claim_date','nim_claim_no','goods_received_date'];
    if(c.not_eligible_reason) cu.push('not_eligible_reason');
    secs.push(['ลูกค้ายื่นเคลม (เว็บ NIM)', cu]);
  }
  if(c.kex_track) secs.push(['เคลม KEX', ['claim_submit_date','kex_claim_no','claim_amount','kex_decision','kex_decision_date','approved_amount','reject_reason','appeal_date','appeal_reason','kex_paid_date','kex_paid_amount','kex_payment_ref']]);
  if(c.nim_track) secs.push(['โอนเงินลูกค้า', ['cust_paid_date','cust_paid_amount']]);
  return secs.map(function(s){
    var keys=s[1].filter(function(x){ return !used[x]; });
    if(!keys.length) return '';
    var open=keys.some(function(x){ return S.form.missing.indexOf(x)>=0; });
    return '<details class="card sec"'+(open?' open':'')+'><summary>'+esc(s[0])+' <span class="desc" style="font-weight:400;font-size:13px">· ดู / แก้ไข</span></summary>'+fgrid(keys,c,used)+'</details>';
  }).join('');
}

          : note('KEX แจ้งทาง Email → เปิดเคสแล้วไป <b>รอลูกค้ายื่นเคลม</b> · ลูกค้าไม่เคลม / ไม่ยื่น กดปิดได้ในหน้าเคส','good'))
      : note('เลือกช่องทางรับรู้เคสก่อน: KEX แจ้งทาง Email หรือ ลูกค้ายื่นเคลมผ่านเว็บ NIM เอง');
    var gw = (src===SRC[1] && lateFiling(c)) ? note(WARN_ICON+' ลูกค้ายื่นเคลมหลังรับสินค้า '+filingGap(c)+' วัน (เกินกำหนด 3 วัน)','bad') : '';

      : '<div class="card empty">ยังไม่มีเคสในรอบนี้</div>')+

function saveImage(elId, fname){
  var go2=function(){
    var el=document.getElementById(elId); if(!el) return;
    document.body.classList.add('img-mode');
    window.html2canvas(el,{ scale:2, backgroundColor:'#F5F6F8' }).then(function(cv){
      cv.toBlob(function(blob){
        var u=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=u; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(u); },2000);
        toast('บันทึกรูปแล้ว');
      },'image/png');
      document.body.classList.remove('img-mode');
    }).catch(function(e){ document.body.classList.remove('img-mode'); toast('บันทึกรูปไม่สำเร็จ: '+(e.message||e)); });
  };
  if(window.html2canvas) return go2();
  toast('กำลังเตรียมรูป…');
  var sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  sc.onload=go2; sc.onerror=function(){ toast('โหลดตัวบันทึกรูปไม่ได้ · ใช้ปุ่ม Print Screen หรือ Ctrl+P แทน'); };
  document.head.appendChild(sc);
}

/* ============================================================ reconcile */
function viewReconcile(){
  var R=S.rec;
  var claimed=S.cases.filter(function(c){ return c.kex_track || c.nim_track || num(c.claim_amount)!=null; });
  var months=uniq(claimed.map(caseMonth)).reverse();
  var rows=claimed.filter(function(c){return R.month==='all'||caseMonth(c)===R.month;});
  var sum=function(arr,f){ return arr.reduce(function(s,c){ return s+(typeof f==='function'?f(c):(num(c[f])||0)); },0); };
  var cnt=function(arr,k){return arr.filter(function(c){return num(c[k])!=null;}).length;};
  var recvAmt=function(c){ return code(c.kex_track)==='K3' ? Math.max(0,(num(c.approved_amount)||0)-(num(c.kex_paid_amount)||0)) : 0; };
  var payAmt=function(c){ return code(c.nim_track)==='N2' ? (dueAmount(c)||0) : 0; };
  var recv=rows.filter(function(c){return recvAmt(c)>0;});
  var pay=rows.filter(function(c){return payAmt(c)>0;});
  var bur=rows.filter(function(c){return burdenOf(c)>0;});
  var over=rows.filter(function(c){return overpay(c)>0;}).sort(function(a,b){ return (overpayOpen(b)?1:0)-(overpayOpen(a)?1:0) || String(a.kex_paid_date).localeCompare(String(b.kex_paid_date)); });
  var overOpen=over.filter(overpayOpen);
  var tC=sum(rows,'claim_amount'), tA=sum(rows,'approved_amount'), tP=sum(rows,'kex_paid_amount'), tU=sum(rows,'cust_paid_amount');
  var tiles=[['ยอดเรียกร้อง',tC,rows.length+' เคสเคลม',0],['ยอดอนุมัติ (KEX)',tA,'อนุมัติ '+cnt(rows,'approved_amount')+' เคส',0],['รับจริงจาก KEX',tP,cnt(rows,'kex_paid_amount')+' เคส',0],
    ['โอนลูกค้าแล้ว (NIM)',tU,cnt(rows,'cust_paid_amount')+' เคส',0],['ค้างรับจาก KEX',sum(recv,recvAmt),recv.length+' เคส · อนุมัติแล้วยังไม่ได้เงิน',1],
    ['ค้างโอนลูกค้า',sum(pay,payAmt),pay.length+' เคส',1],['ส่วนต่างที่ NIM รับภาระ',sum(bur,burdenOf),bur.length+' เคส · โอนลูกค้ามากกว่าที่ได้จาก KEX',1],
    ['KEX โอนเกิน รอจัดการ',sum(overOpen,overpay),overOpen.length+' เคส · '+(over.length-overOpen.length)+' เคสจัดการแล้ว',overOpen.length?1:0]];
  var funnel=[['ยอดเรียกร้อง',tC],['ยอดอนุมัติ',tA],['รับจริงจาก KEX',tP],['โอนลูกค้าแล้ว',tU]];
  var tabRows={ receive:recv, pay:pay, burden:bur, over:over, all:rows }[R.tab]||rows;
  var pendFn={ receive:recvAmt, pay:payAmt, burden:burdenOf, over:overpay, all:null }[R.tab];
  var pendLabel={ receive:'ค้างรับ', pay:'ค้างโอน', burden:'NIM รับภาระ', over:'โอนเกิน' }[R.tab];
  var byM={}; claimed.forEach(function(c){ var m=caseMonth(c); (byM[m]=byM[m]||[]).push(c); });
  var mRows=Object.keys(byM).sort().reverse().map(function(m){ var a=byM[m]; var pr=a.filter(function(c){return num(c.kex_paid_amount)!=null;});
    return '<tr><td>'+mLabel(m)+'</td><td class="r">'+a.length+'</td><td class="r">'+money(sum(a,'claim_amount'))+'</td><td class="r">'+money(sum(a,'approved_amount'))+'</td><td class="r">'+money(sum(a,'kex_paid_amount'))+'</td><td class="r">'+money(sum(a,'cust_paid_amount'))+'</td><td class="r">'+money(sum(a,burdenOf))+'</td><td class="r">'+pct(sum(pr,kexPaidCapped),sum(pr,'claim_amount'))+'</td></tr>'; }).join('');
  var tab=function(id,l,n){return '<button type="button" role="tab" data-tab="'+id+'" aria-selected="'+(R.tab===id)+'">'+l+(n!=null?' · '+n:'')+'</button>';};
  return ''+
  '<div class="head"><div class="title"><h1>กระทบยอดเงิน</h1><div class="desc">เคลมกับ KEX: เรียกร้อง → อนุมัติ → รับเงิน · โอนเงินลูกค้า: = ยอดเรียกร้อง, โอนได้เลยไม่ต้องรอ KEX</div></div>'+
  '<label class="f">รอบเดือนข้อมูล<select id="r-month">'+opts([{v:'all',l:'ทุกเดือน'}].concat(months.map(function(m){return {v:m,l:mLabel(m)};})),R.month)+'</select></label>'+
  (S.boot.sheetUrl?'<a class="btn" href="'+esc(S.boot.sheetUrl)+'" target="_blank" rel="noopener" style="align-self:flex-end">เปิด Google Sheet</a>':'')+'</div>'+
  '<div class="grid-tiles">'+tiles.map(function(t){return '<div class="card tile'+(t[3]?' warn':'')+'"><span class="l">'+t[0]+'</span><span class="v">'+int(t[1])+'</span><span class="s">บาท · '+esc(t[2])+'</span></div>';}).join('')+'</div>'+
  '<section class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>เส้นทางเงิน (เทียบกับยอดเรียกร้อง)</h2>'+
  funnel.map(function(f){ var p=tC?Math.round(f[1]/tC*100):0; return '<div class="hbar" style="grid-template-columns:minmax(110px,160px) minmax(0,1fr) 160px"><span>'+f[0]+'</span><div class="track" style="height:20px"><div class="fill" style="height:20px;width:'+Math.min(p,100)+'%"></div></div><span style="text-align:right"><b>'+int(f[1])+'</b> · '+p+'%</span></div>'; }).join('')+'</section>'+
  '<section class="card"><div class="tabs" role="tablist">'+tab('receive','ค้างรับจาก KEX',recv.length)+tab('pay','ค้างโอนลูกค้า',pay.length)+tab('burden','NIM รับภาระ',bur.length)+tab('over','KEX โอนเกิน',overOpen.length)+tab('all','ทุกเคสเคลม',null)+'</div>'+
  (tabRows.length?'<div class="tbl-wrap"><table style="min-width:1100px"><thead><tr><th>เลขเคส</th><th>ผู้ส่ง</th><th>เคลมกับ KEX</th><th>โอนเงินลูกค้า</th><th>ผล KEX</th><th class="r">เรียกร้อง</th><th class="r">อนุมัติ</th><th class="r">รับจริง KEX</th><th class="r">โอนลูกค้า</th>'+(pendFn?'<th class="r">'+pendLabel+'</th>':'')+'<th>'+(R.tab==='over'?'การจัดการ':'ติดตามล่าสุด')+'</th></tr></thead><tbody>'+
  tabRows.map(function(c){return '<tr><td><button type="button" class="linkbtn" data-open="'+esc(c.case_id)+'">'+esc(c.case_id)+'</button></td><td class="who">'+esc(c.sender)+'</td><td>'+chip(kexCode(c))+'</td><td>'+chip(c.nim_track)+'</td><td>'+esc(c.kex_decision||'–')+'</td><td class="r">'+money(c.claim_amount)+'</td><td class="r">'+money(c.approved_amount)+'</td><td class="r">'+money(c.kex_paid_amount)+'</td><td class="r">'+money(c.cust_paid_amount)+'</td>'+(pendFn?'<td class="r"><b>'+money(pendFn(c))+'</b></td>':'')+'<td>'+(R.tab==='over'?(c.overpay_action?esc(c.overpay_action)+' · '+fmtD(c.overpay_date):'<span class="late-flag">'+WARN_ICON+'รอจัดการ'+(c.kex_paid_date?' · '+daysSince(c.kex_paid_date)+' วัน':'')+'</span>'):fmtD(c.last_followup))+'</td></tr>';}).join('')+
  '</tbody></table></div>':'<div class="empty">ไม่มีรายการ</div>')+'</section>'+
  '<section class="card"><div class="pad" style="padding-bottom:0"><h2>สรุปรายเดือน</h2></div><div class="tbl-wrap">'+(mRows?'<table style="min-width:960px;margin-top:8px"><thead><tr><th>เดือน</th><th class="r">เคสเคลม</th><th class="r">เรียกร้อง</th><th class="r">อนุมัติ</th><th class="r">รับจริง KEX</th><th class="r">โอนลูกค้า</th><th class="r">NIM รับภาระ</th><th class="r">อัตราได้รับชดเชย</th></tr></thead><tbody>'+mRows+'</tbody></table>':'<div class="empty">ยังไม่มีเคสเคลม</div>')+'</div></section>';
}

/* ============================================================ events */
function bind(){
  var $=function(id){return document.getElementById(id);};
  document.querySelectorAll('[data-open]').forEach(function(b){ b.addEventListener('click',function(){ go('form', b.dataset.open); }); });
  if(S.page==='dashboard' && $('d-month')){
    $('d-month').onchange=function(e){ S.dash.month=e.target.value; render(); };
    $('d-print').onclick=function(){ window.print(); };
    $('d-img').onclick=function(){ saveImage('dash-sheet','KEX_Damage_Lost_'+S.dash.month+'.png'); };
    document.querySelectorAll('[data-metric]').forEach(function(b){ b.onclick=function(){ S.dash.metric=b.dataset.metric; render(); }; });
    document.querySelectorAll('.dbars [data-month]').forEach(function(b){ b.onclick=function(){ S.dash.month=b.dataset.month; render(); }; });
  }
  /* กดตัวเลข / แถว → เปิดรายการเคสชุดนั้น (Dashboard · สรุปรายเดือน) */
  document.querySelectorAll('[data-drill]').forEach(function(el){
    var openIt=function(e){ e.stopPropagation(); var d=DRILL[el.dataset.drill]; if(!d) return;
      var from=S.page, m=from==='summary'?S.sum.month:S.dash.month;
      if(from==='summary') S.sum.popup=null;
      S.list={ st:'all', close:'', q:'', type:'', src:'', owner:'', lateOnly:false, ids:d.ids, idsLabel:d.label+' · '+mLabel(m), from:from }; go('list'); };
    el.addEventListener('click',openIt);
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openIt(e); } });
  });
  if(S.page==='list' && $('l-q')){
    $('l-q').oninput=function(e){ S.list.q=e.target.value; var pos=e.target.selectionStart; render(); var q=$('l-q'); q.focus(); q.setSelectionRange(pos,pos); };
    $('l-status').onchange=function(e){ S.list.ids=null; S.list.st=e.target.value; S.list.close=''; render(); };
    if($('l-close')) $('l-close').onchange=function(e){ S.list.close=e.target.value; render(); };
    $('l-src').onchange=function(e){ S.list.src=e.target.value; render(); };
    $('l-type').onchange=function(e){ S.list.type=e.target.value; render(); };
    $('l-owner').onchange=function(e){ S.list.owner=e.target.value; render(); };
    $('l-lateonly').onchange=function(e){ S.list.lateOnly=e.target.checked; render(); };
    $('l-late').onclick=function(){ S.list.lateOnly=!S.list.lateOnly; render(); };
    $('l-new').onclick=function(){ go('form'); };
    if($('l-clear')) $('l-clear').onclick=function(){ S.list.ids=null; S.list.st='open'; render(); };
    if($('l-backdash')) $('l-backdash').onclick=function(){ go(S.list.from==='summary'?'summary':'dashboard'); };
    document.querySelectorAll('[data-st]').forEach(function(b){ b.onclick=function(){ S.list.ids=null; S.list.st = S.list.st===b.dataset.st ? 'open' : b.dataset.st; render(); }; });
  }
  if(S.page==='form' && $('f-back')){
    $('f-back').onclick=function(){ go('list'); };
    if($('f-dup')) $('f-dup').onclick=function(){
      var f=collectForm(), carry={};
      ['cust_claim_date','nim_claim_no','goods_received_date','goods_value'].forEach(function(k){ if(f[k]) carry[k]=f[k]; });
      S.carry = (S.form.dup.reopenable && Object.keys(carry).length) ? carry : null;
      go('form', S.form.dup.case_id);
    };
    document.querySelectorAll('[data-act]').forEach(function(b){ b.onclick=function(){ submitForm(b.dataset.act); }; });
    ['source','prescreen','claim_intent','kex_decision','incident_type','goods_received_date','cust_claim_date'].forEach(function(k){
      var el=document.querySelector('#main [data-k="'+k+'"]');
      if(el) el.addEventListener('change',function(){ var y=window.scrollY; S.form.draft=collectForm(); render(); window.scrollTo(0,y); });
    });
    var add=$('fu-add');
    if(add) add.onclick=function(){
      if(S.busy) return;
      var p={ case_id:S.form.caseId, followup_date:$('fu-date').value, channel:$('fu-ch').value, detail:$('fu-detail').value, result:$('fu-result').value };
      if(!p.detail.trim()){ $('fu-detail').classList.add('err'); $('fu-detail').focus(); return; }
      S.busy=true; setBusy(true); S.form.draft=collectForm();
      api('addFollowup',p).then(function(r){ S.busy=false; if(!r.ok){ toast(r.message); setBusy(false); return; } toast(r.message);
        applyBundle(r); render(); if(!r.detail){ refreshCases().then(function(){ loadDetail(S.form.caseId); }); } })
      .catch(function(e){ S.busy=false; setBusy(false); toast('ไม่สำเร็จ: '+(e.message||e)); });
    };
  }
  if(S.page==='summary' && $('s-month')){
    $('s-month').onchange=function(e){ S.sum.month=e.target.value; render(); };
    $('s-img').onclick=saveSummaryImage;
    document.querySelectorAll('[data-all]').forEach(function(b){ b.onclick=function(){ S.sum.popup=b.dataset.all; S.sum.pq=''; render(); var q=$('s-pq'); if(q) q.focus(); }; });
    if($('s-pclose')) $('s-pclose').onclick=function(){ S.sum.popup=null; render(); };
    if($('s-pq')) $('s-pq').oninput=function(e){ S.sum.pq=e.target.value; var pos=e.target.selectionStart; render(); var q=$('s-pq'); q.focus(); q.setSelectionRange(pos,pos); };
    var md=document.querySelector('.modal'); if(md) md.addEventListener('click',function(e){ if(e.target===md){ S.sum.popup=null; render(); } });
  }
  if(S.page==='reconcile' && $('r-month')){
    $('r-month').onchange=function(e){ S.rec.month=e.target.value; render(); };
    document.querySelectorAll('[data-tab]').forEach(function(b){ b.onclick=function(){ S.rec.tab=b.dataset.tab; render(); }; });
  }
}

/* ============================================================ login + start */
function setNav(on){ document.querySelector('nav').style.display = on ? '' : 'none'; }
function showLogin(note){
  setNav(false);
  S.boot=null;
  var m=document.getElementById('main');
  m.innerHTML='<div class="card pad" style="max-width:440px;width:100%;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px">'+
    '<div><div style="font-size:20px;font-weight:700">NIM Claim · เคส KEX</div><div class="desc">เข้าสู่ระบบด้วยรหัสผ่านทีม</div></div>'+
    (note?'<div class="msg note">'+esc(note)+'</div>':'')+
    '<label class="f" for="lg-pass"><span class="lab">รหัสผ่านทีม</span><input type="password" id="lg-pass" autocomplete="current-password"></label>'+
    '<button type="button" class="btn primary" id="lg-go" style="justify-content:center">ถัดไป</button>'+
    '<div id="lg-msg"></div></div>';
  var pass=document.getElementById('lg-pass'), btn=document.getElementById('lg-go'), msg=document.getElementById('lg-msg');
  pass.focus();
  var submit=function(){
    if(!pass.value){ pass.classList.add('err'); return; }
    btn.disabled=true; msg.innerHTML='<div class="desc">กำลังตรวจสอบ…</div>';
    var tmp={ password:pass.value, user:'' };
    initCall(tmp).then(function(d){ saveSession({ password:tmp.password, user:'ทีม Claim' }); start(d); })
      .catch(function(e){ btn.disabled=false; msg.innerHTML='<div class="msg bad">'+esc(e.message)+'</div>'; });
  };
  btn.onclick=submit;
  pass.onkeydown=function(e){ if(e.key==='Enter') submit(); };
}
function start(initData){
  setNav(true);
  document.getElementById('user').textContent=SESSION.user;
  var apply=function(d){
    var first=!S.boot;
    S.boot=d.boot; S.cases=d.cases; saveCache();
    if(first) go('dashboard');
    else if(!(S.page==='form' && S.busy)) render();
  };
  if(initData){ apply(initData); markSynced(); return; }
  var cache=readCache();
  if(cache && cache.boot && cache.cases){ S.boot=cache.boot; S.cases=cache.cases; go('dashboard'); }
  else document.getElementById('main').innerHTML='<div class="loading">กำลังโหลดข้อมูล…</div>';
  setSync(true);
  initCall().catch(function(e){ if(e.auth){ saveSession(null); showLogin('รหัสผ่านถูกเปลี่ยน กรุณาเข้าสู่ระบบใหม่'); } throw e; }).then(function(d){ setSync(false); apply(d); markSynced(); }).catch(function(e){
    setSync(false);
    if(e.auth) return;
    if(S.boot){ toast('อัปเดตข้อมูลไม่สำเร็จ: '+(e.message||e)); return; }
    document.getElementById('main').innerHTML='<div class="msg bad">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message||e)+'</div><button type="button" class="btn" onclick="start()">ลองใหม่</button>';
  });
}
/* ปุ่มรีเฟรช: ดึงข้อมูลล่าสุดจาก Google Sheet โดยไม่ต้องโหลดหน้าใหม่ (อยู่หน้าเดิม · ตัวกรองเดิม) */
function markSynced(){ var el=document.getElementById('synced'); if(el){ var d=new Date(); el.textContent='อัปเดตล่าสุด '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' น.'; } }
function refreshAll(){
  if(S.busy || refreshAll.on) return;
  refreshAll.on=true; var btn=document.getElementById('refresh'); if(btn) btn.disabled=true; setSync(true);
  initCall().then(function(d){
    S.boot=d.boot; S.cases=d.cases; saveCache(); markSynced();
    if(S.page==='form' && S.form.caseId){ S.form.draft=null; loadDetail(S.form.caseId); }
    render(); toast('อัปเดตข้อมูลล่าสุดแล้ว');
  }).catch(function(e){ if(e.auth){ saveSession(null); showLogin('รหัสผ่านถูกเปลี่ยน กรุณาเข้าสู่ระบบใหม่'); return; } toast('รีเฟรชไม่สำเร็จ: '+(e.message||e)); })
  .then(function(){ refreshAll.on=false; setSync(false); if(btn) btn.disabled=false; });
}
document.getElementById('refresh').onclick=refreshAll;
document.getElementById('logout').onclick=function(){ saveSession(null); try{ localStorage.removeItem(CACHE_KEY); }catch(e){} S.cases=[]; showLogin(); };

if(!API_URL){
  setNav(false);
  document.getElementById('main').innerHTML='<div class="card pad" style="max-width:640px;margin:8vh auto 0"><h2>ยังไม่ได้เชื่อม Google Sheet</h2><p class="desc">เปิดไฟล์ index.html แก้บรรทัด <span class="mono">var API_URL = \'\';</span> โดยวางลิงก์ตัวเชื่อม (Web app URL จาก Apps Script) ระหว่างเครื่องหมาย \' \' แล้วอัปโหลดขึ้น GitHub อีกครั้ง</p></div>';
} else if(SESSION && SESSION.password && SESSION.user){ start(); }
else { showLogin(); }
